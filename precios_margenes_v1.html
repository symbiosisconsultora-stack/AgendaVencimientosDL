<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Precios y Márgenes — Distribuidora Lucas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1e3a6e;--azul2:#2a4f96;--azul3:#e8edf8;--azul4:#d0dbf0;--azulx:#f0f4fc;
  --nar:#F26522;--nar2:#ff7a3d;--nar3:#fff1ea;--nar4:#ffd6bd;
  --bg:#f2f5fb;--w:#ffffff;--s1:#f7f9fd;--s2:#eef1f8;
  --brd:#dde2f0;--brd2:#c8d0e8;
  --tx:#1a2540;--tx2:#4a5580;--tx3:#8892b0;
  --gn:#0a7c4e;--gn2:#e6f7f0;--gn3:#b8edd8;
  --rd:#c41a1a;--rd2:#fff1f0;--rd3:#ffd5d5;
  --yl:#a06200;--yl2:#fff8e6;--yl3:#ffe4a0;
  --bl:#2c5fc4;--bl2:#edf2ff;--bl3:#c4d4f8;
  --mn:'DM Mono',monospace;--sf:'Plus Jakarta Sans',sans-serif;
  --sh:0 1px 3px rgba(30,58,110,.08),0 1px 2px rgba(30,58,110,.05);
  --sh2:0 4px 20px rgba(30,58,110,.13),0 2px 6px rgba(30,58,110,.07);
}
body{background:var(--bg);color:var(--tx);font-family:var(--sf);min-height:100vh;font-size:13px;line-height:1.5}

/* LOGIN */
#loginBg{position:fixed;inset:0;background:var(--azul);display:flex;align-items:center;justify-content:center;z-index:2000;flex-direction:column;gap:18px}
.login-box{background:var(--w);border-radius:16px;padding:36px 40px;box-shadow:var(--sh2);width:100%;max-width:340px;text-align:center}
.login-ttl{font-size:15px;font-weight:800;color:var(--azul);margin:14px 0 4px}
.login-sub{font-size:11px;color:var(--tx3);font-family:var(--mn);margin-bottom:18px}
.login-inp{width:100%;padding:11px 14px;border:1.5px solid var(--brd2);border-radius:9px;font-size:14px;font-family:var(--mn);text-align:center;letter-spacing:2px;outline:none}
.login-inp:focus{border-color:var(--nar)}
.login-err{color:var(--rd);font-size:11px;margin-top:8px;min-height:14px}

/* NAV */
nav{background:var(--w);border-bottom:2px solid var(--azul4);padding:0 24px;
  display:flex;align-items:stretch;position:sticky;top:0;z-index:300;box-shadow:var(--sh)}
.n-logo{display:flex;align-items:center;gap:10px;padding:8px 20px 8px 0;border-right:1px solid var(--brd);margin-right:6px;flex-shrink:0}
.n-tabs{display:flex;flex:1;overflow-x:auto}
.n-tab{padding:0 16px;display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:11.5px;font-weight:600;color:var(--tx3);border-bottom:3px solid transparent;
  margin-bottom:-2px;transition:.15s;white-space:nowrap}
.n-tab:hover{color:var(--azul);background:var(--azulx)}
.n-tab.on{color:var(--azul);border-bottom-color:var(--nar);font-weight:700}
.n-tab .pill{font-family:var(--mn);font-size:9px;background:var(--nar3);color:var(--nar);
  border:1px solid var(--nar4);padding:1px 6px;border-radius:10px}
.sp{flex:1}

/* PAGES */
.page{display:none;flex-direction:column;min-height:calc(100vh - 54px)}
.page.on{display:flex}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-family:var(--sf);
  font-size:12px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.b-azul{background:var(--azul);color:#fff}.b-azul:hover{background:var(--azul2);box-shadow:var(--sh2)}
.b-nar{background:var(--nar);color:#fff}.b-nar:hover{background:var(--nar2)}
.b-gn{background:var(--gn2);color:var(--gn);border:1px solid var(--gn3)}.b-gn:hover{background:var(--gn3)}
.b-bl{background:var(--bl2);color:var(--bl);border:1px solid var(--bl3)}.b-bl:hover{background:var(--bl3)}
.b-rd{background:var(--rd2);color:var(--rd);border:1px solid var(--rd3)}.b-rd:hover{background:var(--rd3)}
.b-gh{background:var(--w);color:var(--tx2);border:1px solid var(--brd);box-shadow:var(--sh)}.b-gh:hover{border-color:var(--azul);color:var(--azul)}
.b-sm{padding:5px 11px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* UPLOAD */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 24px}
.dz{width:100%;max-width:520px;border:2px dashed var(--brd2);border-radius:14px;
  padding:40px 28px;text-align:center;cursor:pointer;transition:.2s;background:var(--w);position:relative;box-shadow:var(--sh)}
.dz:hover,.dz.drag{border-color:var(--nar);background:var(--nar3)}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz-ico{font-size:38px;margin-bottom:10px}
.dz-ttl{font-size:15px;font-weight:700;margin-bottom:5px;color:var(--tx)}
.dz-sub{color:var(--tx3);font-size:11px;font-family:var(--mn)}
.note{max-width:520px;width:100%;font-size:11.5px;color:var(--tx2);background:var(--w);
  border:1px solid var(--brd);border-radius:10px;padding:13px 17px;line-height:1.8;box-shadow:var(--sh)}
.note strong{color:var(--nar)}.note code{font-family:var(--mn);font-size:10px;background:var(--azul3);color:var(--azul);padding:1px 5px;border-radius:4px}

.spin{width:32px;height:32px;border:3px solid var(--brd2);border-top-color:var(--azul);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* KPI */
.kpi-row{display:flex;gap:10px;padding:14px 20px;flex-wrap:wrap;border-bottom:1px solid var(--brd);background:var(--w)}
.kpi{background:var(--s1);border:1px solid var(--brd);border-radius:10px;padding:12px 16px;flex:1;min-width:130px}
.kpi-v{font-size:20px;font-weight:800;font-family:var(--mn);line-height:1;color:var(--azul)}
.kpi-l{font-size:9.5px;color:var(--tx3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.kpi.c-rd .kpi-v{color:var(--rd)}.kpi.c-gn .kpi-v{color:var(--gn)}.kpi.c-yl .kpi-v{color:var(--yl)}.kpi.c-nar .kpi-v{color:var(--nar)}

/* CTRL BAR */
.c-bar{background:var(--w);border-bottom:1px solid var(--brd);padding:10px 20px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--sh)}
.cb-ttl{font-size:14px;font-weight:800;color:var(--azul)}
.cb-sub{font-family:var(--mn);font-size:10px;color:var(--tx3);margin-top:1px}

/* FILTER */
.fbar{padding:8px 20px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--brd);background:var(--s1);flex-wrap:wrap}
.fl{font-size:9px;color:var(--tx3);font-family:var(--mn);text-transform:uppercase;letter-spacing:.6px}
.fb{padding:4px 12px;border-radius:20px;border:1.5px solid var(--brd);background:var(--w);
  color:var(--tx3);cursor:pointer;font-size:11px;font-weight:600;transition:.12s}
.fb.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.fb.on.fv{background:var(--rd);color:#fff;border-color:var(--rd)}
.fb.on.fg{background:var(--gn);color:#fff;border-color:var(--gn)}
.fb.on.fy{background:var(--yl);color:#fff;border-color:var(--yl)}
.fb:hover:not(.on){border-color:var(--azul2);color:var(--azul)}
.srch{padding:5px 12px;border:1.5px solid var(--brd2);border-radius:20px;font-size:11.5px;font-family:var(--sf);outline:none;min-width:200px;background:var(--w)}
.srch:focus{border-color:var(--nar)}

/* TABLE */
.tbl-wrap{flex:1;overflow-x:auto;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--azul);color:#fff;padding:8px 10px;text-align:left;
  font-size:9.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  position:sticky;top:0;z-index:2;border-right:1px solid rgba(255,255,255,.1)}
th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--brd);transition:.07s}
tbody tr:nth-child(even){background:var(--s1)}
tbody tr:hover td{background:var(--azul3)!important}
td{padding:6px 10px;color:var(--tx2);vertical-align:middle}
td.mn{font-family:var(--mn);font-size:10.5px}
td.r{text-align:right;font-family:var(--mn)}
td.bold{font-weight:700;color:var(--tx)}
tr.row-r{background:#fff6f5!important}tr.row-r:hover td{background:#ffe8e5!important}
tr.row-y{background:#fffcf0!important}tr.row-y:hover td{background:#fff4d6!important}

/* SEMAFORO */
.sem{display:inline-flex;align-items:center;gap:5px;font-family:var(--mn);font-weight:700;font-size:11px;padding:2px 9px;border-radius:20px}
.sem-r{background:var(--rd2);color:var(--rd)}
.sem-y{background:var(--yl2);color:var(--yl)}
.sem-g{background:var(--gn2);color:var(--gn)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-r{background:var(--rd)}.dot-y{background:var(--yl)}.dot-g{background:var(--gn)}

.var-up{color:var(--rd);font-weight:700}
.var-dn{color:var(--gn);font-weight:700}
.var-eq{color:var(--tx3)}

/* SELECT/INPUT generic */
select,input[type=text],input[type=number]{font-family:var(--sf);font-size:12px;padding:6px 10px;border:1.5px solid var(--brd2);border-radius:7px;outline:none;background:var(--w);color:var(--tx)}
select:focus,input:focus{border-color:var(--nar)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--tx3);font-family:var(--mn);text-transform:uppercase;letter-spacing:.4px}

/* CONFIG FORM */
.cfg-wrap{padding:24px;max-width:640px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}
.cfg-card{background:var(--w);border:1px solid var(--brd);border-radius:12px;padding:18px 22px;box-shadow:var(--sh)}
.cfg-card h3{font-size:13px;color:var(--azul);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--s2)}
.cfg-row:last-child{border-bottom:none}
.cfg-lbl{font-size:12px;color:var(--tx2)}
.cfg-hint{font-size:10px;color:var(--tx3);margin-top:2px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,60,.5);display:none;align-items:center;justify-content:center;z-index:900;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--w);border-radius:14px;width:100%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--sh2);overflow:hidden}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center;background:var(--azul3)}
.modal-ttl{font-size:14px;font-weight:800;color:var(--azul)}
.modal-close{background:none;border:none;font-size:16px;cursor:pointer;color:var(--tx3)}
.modal-body{flex:1;overflow-y:auto;padding:16px 20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--brd);display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--tx);color:#fff;
  padding:11px 22px;border-radius:9px;font-size:12px;font-weight:600;
  z-index:1000;opacity:0;transition:.22s;pointer-events:none;box-shadow:var(--sh2)}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.err{background:var(--rd2);border:1px solid var(--rd3);border-radius:10px;padding:11px 15px;font-size:12px;color:var(--rd);max-width:520px;width:100%}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--tx3);padding:40px}
.empty-ico{font-size:38px;opacity:.5}

/* TABLERO */
.tbl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 20px}
.chart-card{background:var(--w);border:1px solid var(--brd);border-radius:12px;padding:16px 18px;box-shadow:var(--sh)}
.chart-card h4{font-size:12px;color:var(--azul);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.chart-card.full{grid-column:1/-1}
.dec-item{display:flex;gap:10px;padding:11px 14px;border-radius:9px;margin-bottom:8px;font-size:12px;line-height:1.5}
.dec-alerta{background:var(--rd2);border:1px solid var(--rd3);color:#7a1414}
.dec-oport{background:var(--gn2);border:1px solid var(--gn3);color:#0a4a30}
.dec-info{background:var(--bl2);border:1px solid var(--bl3);color:#173a7a}
.dec-ico{font-size:16px;flex-shrink:0}
.modo-tabs{display:flex;gap:6px;margin-bottom:8px}
.modo-tab{padding:3px 10px;border-radius:14px;border:1.5px solid var(--brd);background:var(--w);color:var(--tx3);cursor:pointer;font-size:10px;font-weight:700}
.modo-tab.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.progbar{height:8px;background:var(--s2);border-radius:5px;overflow:hidden;margin-top:4px}
.progbar-fill{height:100%;background:var(--gn);border-radius:5px}
.progbar-fill.over{background:var(--nar)}

/* HOJA IMPRIMIBLE DE OFERTAS */
.print-sheet{background:#fff;border:1px solid var(--brd);border-radius:10px;padding:30px 34px;font-family:var(--sf);color:#1a2540;max-width:640px;margin:0 auto;box-shadow:var(--sh)}
.print-sheet h1{font-size:17px;text-align:center;margin-bottom:2px;letter-spacing:.4px}
.print-sheet .ps-sub{text-align:center;color:#8892b0;font-size:10.5px;margin-bottom:20px;font-family:var(--mn)}
.ps-item-simple{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--brd);font-size:12.5px}
.ps-item-desc{padding:12px 0;border-bottom:1px solid var(--brd)}
.ps-item-desc .ps-nombre{font-weight:800;font-size:13px;margin-bottom:4px}
.ps-item-desc .ps-linea{font-size:11.5px;color:#4a5580}
.ps-item-desc .ps-precio-pub{font-weight:800;color:var(--nar);font-size:14px}
.ps-promos{margin-top:18px;padding-top:14px;border-top:2px solid var(--azul3);font-size:11.5px;white-space:pre-wrap;color:#333}
.ps-footer{text-align:center;margin-top:20px;font-size:11px;color:#8892b0}
@media print{
  body *{visibility:hidden}
  #printSheetWrap, #printSheetWrap *{visibility:visible}
  #printSheetWrap{position:absolute;left:0;top:0;width:100%;margin:0;padding:0}
  .no-print{display:none!important}
  .print-sheet{box-shadow:none;border:none;max-width:100%}
}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}
input:focus-visible,select:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

<script>
/* ============================================================
   CONFIG / STORAGE
============================================================ */
const LS_MAESTRO='dl_precios_maestro_v1';
const LS_HIST='dl_precios_hist_v1';
const LS_MAP='dl_precios_map_v1';
const LS_CFG='dl_precios_cfg_v1';
const LS_SESSION='dl_precios_sesion_v1';
const LS_RUBROS='dl_precios_rubros_v1';
const LS_ANULADOS='dl_precios_anulados_v1';

function defCfg(){return{password:'lucas2026',margenRojo:15,margenAmarillo:25,margenRojoRev:10,margenAmarilloRev:18,
  listas:{iva:21,lista2:3,lista3:20,lista4:-10}};}
function loadCfg(){try{const s=localStorage.getItem(LS_CFG);return s?Object.assign(defCfg(),JSON.parse(s)):defCfg();}catch{return defCfg();}}
function saveCfg(c){localStorage.setItem(LS_CFG,JSON.stringify(c));}
let CFG=loadCfg();

function loadMaestro(){try{const s=localStorage.getItem(LS_MAESTRO);return s?JSON.parse(s):null;}catch{return null;}}
function saveMaestro(m){localStorage.setItem(LS_MAESTRO,JSON.stringify(m));}
function loadHist(){try{const s=localStorage.getItem(LS_HIST);return s?JSON.parse(s):[];}catch{return [];}}
function saveHist(h){localStorage.setItem(LS_HIST,JSON.stringify(h));}
function loadMap(){try{const s=localStorage.getItem(LS_MAP);return s?JSON.parse(s):{};}catch{return {};}}
function saveMap(m){localStorage.setItem(LS_MAP,JSON.stringify(m));}
function loadAnulados(){try{const s=localStorage.getItem(LS_ANULADOS);return s?JSON.parse(s):[];}catch{return [];}}
function saveAnulados(a){try{localStorage.setItem(LS_ANULADOS,JSON.stringify(a));}catch(e){}}
function loadRubros(){try{const s=localStorage.getItem(LS_RUBROS);return s?JSON.parse(s):[];}catch{return [];}}
function saveRubros(r){localStorage.setItem(LS_RUBROS,JSON.stringify(r));}

let MAESTRO = loadMaestro();     // {items:[...], fecha, fuente}
let HIST = loadHist();

let ANULADOS = loadAnulados();   // códigos marcados como Anulado=SI en el Excel de Artículos de Chess (no se importan)

/* ============================================================
   HELPERS
============================================================ */
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('on'),3200);}
function fmtMoney(n){if(n===null||n===undefined||isNaN(n))return '—';return '$ '+n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(n){if(n===null||n===undefined||isNaN(n))return '—';return (n*100).toFixed(1)+'%';}
function toPct(frac){return (frac===null||frac===undefined||isNaN(frac))?'':+(frac*100).toFixed(4);}
function fromPct(val){return numOr(val)/100;}
function numOr(v){
  if(typeof v!=='string')return isFinite(v)?Number(v):0;
  let s=v.trim();
  // los <input type="number"> del navegador siempre devuelven decimal con punto (ej "1234.56"), sin separador de miles.
  // Solo si viene con coma (pegado a mano en formato AR "1.234,56") tratamos el punto como separador de miles.
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s);
  return isFinite(n)?n:0;
}
function normKey(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');}
function normText(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function tokenSet(s){return new Set(normText(s).split(' ').filter(w=>w.length>1));}
function jaccard(a,b){const A=tokenSet(a),B=tokenSet(b);if(!A.size||!B.size)return 0;let inter=0;A.forEach(x=>{if(B.has(x))inter++;});return inter/(A.size+B.size-inter);}
function parseArNumber(s){if(s===null||s===undefined)return NaN;s=String(s).trim().replace(/\./g,'').replace(',','.');return parseFloat(s);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function todayStr(){return new Date().toLocaleDateString('es-AR');}

function findColExact(headerNorm,variants,exclude){
  for(const v of variants){const nv=normKey(v);const idx=headerNorm.findIndex((h,i)=>h===nv&&!exclude.includes(i));if(idx>=0)return idx;}
  return -1;
}
function findColStarts(headerNorm,variants,exclude){
  for(const v of variants){const nv=normKey(v);const idx=headerNorm.findIndex((h,i)=>h.startsWith(nv)&&!exclude.includes(i));if(idx>=0)return idx;}
  return -1;
}
function findCol(header,variants,exclude=[]){
  const hn=header.map(h=>normKey(h));
  let idx=findColExact(hn,variants,exclude); if(idx>=0)return idx;
  idx=findColStarts(hn,variants,exclude); if(idx>=0)return idx;
  return -1;
}
function findHeaderRow(aoa,groups){
  for(let i=0;i<Math.min(aoa.length,25);i++){
    const row=(aoa[i]||[]).map(c=>normKey(c));
    const ok=groups.every(g=>g.some(v=>row.some(h=>h.startsWith(normKey(v)))));
    if(ok)return i;
  }
  return -1;
}

/* ============================================================
   MODELO — CALCULO DE PRECIOS
============================================================ */
function calcItem(it){
  // Réplica exacta de la hoja FORMADOR: Neto = Costo Final x (1 + Margen)
  // La fórmula real usada es configurable por proveedor — ver biblioteca de FORMULAS + FORMULACFG.
  const costo=it.costo||0;
  const d1=it.desc1||0, d2=it.desc2||0;
  const margen=it.margen||0;
  const f=getFormulaCfg(it.prov);
  const base={COSTO:costo,DESC1:d1,DESC2:d2,MARGEN:margen};
  const parcial1=evalFormulaExpr(f.parcial1,base);
  const parcial2=evalFormulaExpr(f.parcial2,Object.assign({},base,{PARCIAL1:parcial1}));
  const neto=evalFormulaExpr(f.neto,Object.assign({},base,{PARCIAL1:parcial1,PARCIAL2:parcial2}));
  let netoRev=null;
  if(it.margenRev!==null&&it.margenRev!==undefined){
    const baseRev=Object.assign({},base,{MARGEN:it.margenRev,PARCIAL1:parcial1,PARCIAL2:parcial2});
    netoRev = evalFormulaExpr(f.neto,baseRev);
  }
  return {parcial1,parcial2,neto,netoRev};
}
/* ============================================================
   BIBLIOTECA DE FÓRMULAS — predefinidas + las que el usuario cree
   Cada fórmula define 3 expresiones evaluadas en cadena, con variables:
   COSTO, DESC1, DESC2, MARGEN siempre disponibles (como fracción, 0.16=16%);
   PARCIAL1 disponible desde "Parcial 2" en adelante; PARCIAL2 disponible en "Neto".
============================================================ */
function formulasBuiltin(){
  return [
    {id:'estandar', nombre:'Estándar (encadenado + recargo sobre costo)', builtin:true,
      parcial1:'COSTO*(1-DESC1)', parcial2:'PARCIAL1*(1-DESC2)', neto:'PARCIAL2*(1+MARGEN)'},
    {id:'suma_recargo', nombre:'Descuentos en suma simple + recargo sobre costo', builtin:true,
      parcial1:'COSTO', parcial2:'COSTO*(1-(DESC1+DESC2))', neto:'PARCIAL2*(1+MARGEN)'},
    {id:'encadenado_venta', nombre:'Encadenado + margen % sobre precio de venta', builtin:true,
      parcial1:'COSTO*(1-DESC1)', parcial2:'PARCIAL1*(1-DESC2)', neto:'MARGEN<1?PARCIAL2/(1-MARGEN):PARCIAL2'},
    {id:'suma_venta', nombre:'Descuentos en suma simple + margen % sobre precio de venta', builtin:true,
      parcial1:'COSTO', parcial2:'COSTO*(1-(DESC1+DESC2))', neto:'MARGEN<1?PARCIAL2/(1-MARGEN):PARCIAL2'},
    {id:'donyeyo_deviano', nombre:'DON YEYO / DEVIANO (fórmula real del Excel, marca propia)', builtin:true,
      parcial1:'COSTO-(DESC1*COSTO)', parcial2:'((PARCIAL1/3*4)+((PARCIAL1*1.21)-PARCIAL1))/1.21', neto:'PARCIAL2*(1+MARGEN)'},
  ];
}
const LS_FORMULAS='dl_precios_formulas_v1';
function loadFormulasCustom(){try{const s=localStorage.getItem(LS_FORMULAS);return s?JSON.parse(s).filter(f=>!f.builtin):[];}catch{return [];}}
function saveFormulasCustom(list){localStorage.setItem(LS_FORMULAS,JSON.stringify(list.filter(f=>!f.builtin)));}
let FORMULAS=formulasBuiltin().concat(loadFormulasCustom());
function getFormulaById(id){ return FORMULAS.find(f=>f.id===id) || FORMULAS[0]; }
function evalFormulaExpr(expr,vars){
  try{
    const keys=Object.keys(vars);
    const fn=new Function(...keys, 'return ('+expr+');');
    const v=fn(...keys.map(k=>vars[k]));
    return typeof v==='number'&&isFinite(v)? v : 0;
  }catch(e){ return 0; }
}
function crearFormula(nombre,parcial1Expr,parcial2Expr,netoExpr){
  const f={id:'custom_'+uid(),nombre,builtin:false,parcial1:parcial1Expr,parcial2:parcial2Expr,neto:netoExpr};
  FORMULAS.push(f);
  saveFormulasCustom(FORMULAS);
  return f;
}
function borrarFormula(id){
  const f=FORMULAS.find(x=>x.id===id);
  if(!f||f.builtin)return;
  FORMULAS=FORMULAS.filter(x=>x.id!==id);
  saveFormulasCustom(FORMULAS);
  Object.keys(FORMULACFG).forEach(k=>{ if(FORMULACFG[k].formulaId===id) FORMULACFG[k].formulaId='estandar'; });
  saveFormulaCfg(FORMULACFG);
}
/* ============================================================
   FÓRMULA POR PROVEEDOR — qué fórmula de la biblioteca usa cada proveedor
============================================================ */
const LS_FORMULACFG='dl_precios_formulacfg_v1';
function loadFormulaCfg(){
  try{
    const s=localStorage.getItem(LS_FORMULACFG);
    const raw=s? JSON.parse(s) : {};
    // migración de versiones viejas (modoDesc/modoMargen) al nuevo formulaId
    Object.keys(raw).forEach(k=>{
      const v=raw[k];
      if(v&&!v.formulaId){
        if(v.modoDesc==='suma'&&v.modoMargen==='margenventa') v.formulaId='suma_venta';
        else if(v.modoDesc==='suma') v.formulaId='suma_recargo';
        else if(v.modoMargen==='margenventa') v.formulaId='encadenado_venta';
        else v.formulaId='estandar';
      }
    });
    return raw;
  }catch{return {};}
}
function saveFormulaCfg(f){localStorage.setItem(LS_FORMULACFG,JSON.stringify(f));}
let FORMULACFG=loadFormulaCfg();
// Fórmula por defecto para proveedores particulares, cuando todavía no se guardó una elección manual en FORMULACFG.
// Sacada de las fórmulas reales de las celdas del Excel base (PRECIOS_BIEN.xlsx, hoja FORMADOR):
// TREGAR usa la fórmula estándar común a la mayoría de los proveedores (no necesita entrada acá).
// DON YEYO y DEVIANO (marca propia) usan en cambio esta fórmula particular para el Costo Final.
const FORMULA_DEFAULT_POR_PROV={};
[['DON YEYO','donyeyo_deviano'],['DEVIANO','donyeyo_deviano']].forEach(([prov,id])=>{ FORMULA_DEFAULT_POR_PROV[normKey(prov)]=id; });
function getFormulaCfg(prov){
  const entry=FORMULACFG[normKey(prov)];
  if(entry) return getFormulaById(entry.formulaId);
  const def=FORMULA_DEFAULT_POR_PROV[normKey(prov)];
  return getFormulaById(def||'estandar');
}
function guardarFormulaCfg(prov,formulaId){
  FORMULACFG[normKey(prov)]={formulaId,provLabel:prov,fecha:new Date().toISOString()};
  saveFormulaCfg(FORMULACFG);
}
function margenEfectivo(it){ // margen real resultante (costo final vs neto), por si el neto se edita a mano
  const c=calcItem(it);
  const neto = it.neto!=null? it.neto : c.neto;
  return neto? (neto-c.parcial2)/c.parcial2 : 0; // recargo sobre costo
}

  if(VERSIONES.length>15)VERSIONES=VERSIONES.slice(0,15);

}

/* ============================================================
   MAESTRO — IMPORTAR EXCEL (formato FORMADOR)
============================================================ */
function handleMaestroFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const result=parseMaestroWorkbook(wb);
      if(!result || !result.items.length){
        // Este archivo no tiene columna COSTO — probablemente es el Excel de Artículos de Chess (EAN),
        // que va en el otro botón. Lo detectamos y lo procesamos igual, en vez de dejar al usuario sin saber qué pasó.
        const comoArticulos=parseArticulosChessWorkbook(wb);
        if(comoArticulos && comoArticulos.count){
          aplicarArticulosComoBase(comoArticulos,file.name);
          renderMaestro();
          return;
        }
        toast('No pude reconocer el formato. Revisá que tenga una hoja con columnas COD / ARTICULO / COSTO.');
        return;
      }
      const rubroPorCod={};
      if(MAESTRO&&MAESTRO.items)MAESTRO.items.forEach(i=>{ if(i.rubro)rubroPorCod[i.cod]=i.rubro; });
      result.items.forEach(i=>{ if(rubroPorCod[i.cod])i.rubro=rubroPorCod[i.cod]; });
      MAESTRO={items:result.items,fecha:new Date().toISOString(),fuente:file.name,revCount:result.revCount,eanCount:result.eanCount};
      saveMaestro(MAESTRO);
      if(ARTICULOS_DATA){mergeArticulos();}else{aplicarAnulados();}
      guardarVersionMaestro('Carga de Excel: '+file.name);
      toast('Maestro actualizado: '+MAESTRO.items.length+' artículos ('+MAESTRO.eanCount+' con EAN, '+result.revCount+' con margen revendedor)'+textoAnulados());
      renderMaestro();
    }catch(err){
      console.error(err);
      toast('Error leyendo el archivo: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseMaestroWorkbook(wb){
  let primary=null, rev=null, superList=null;
  wb.SheetNames.forEach(name=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null,raw:true});
    // intento FORMADOR-like (COD + ARTICULO + COSTO)
    const hIdx=findHeaderRow(aoa,[['COD','CODIGO'],['ARTICULO','DESCRIPCION'],['COSTO']]);
    if(hIdx>=0){
      const header=aoa[hIdx];
      const iCod=findCol(header,['COD','CODIGO']);
      const iProv=findCol(header,['PROV','PROVEEDOR'],[iCod]);
      const iArt=findCol(header,['ARTICULO','DESCRIPCION'],[iCod,iProv]);
      const iCosto=findCol(header,['COSTO'],[iCod,iProv,iArt]);
      const iDesc1=findCol(header,['DESC1'],[iCod,iProv,iArt,iCosto]);
      const iDesc2=findCol(header,['DESC2'],[iCod,iProv,iArt,iCosto,iDesc1]);
      const iMargen=findCol(header,['MARGEN'],[iCod,iProv,iArt,iCosto,iDesc1,iDesc2]);
      const iNeto=findCol(header,['NETO'],[iCod,iProv,iArt,iCosto,iDesc1,iDesc2,iMargen]);
      const rows=[];
      for(let r=hIdx+1;r<aoa.length;r++){
        const row=aoa[r]; if(!row) continue;
        const cod=row[iCod], art=iArt>=0?row[iArt]:null;
        if(cod===undefined||cod===null||cod===''||!art) continue;
        if(isNaN(Number(cod))) continue;
        rows.push({
          cod:Number(cod), prov: iProv>=0?String(row[iProv]||'').trim():'', articulo:String(art).trim(),
          costo:iCosto>=0?numOr(row[iCosto]):0, desc1:iDesc1>=0?numOr(row[iDesc1]):0, desc2:iDesc2>=0?numOr(row[iDesc2]):0,
          margen:iMargen>=0?numOr(row[iMargen]):0, netoOriginal:iNeto>=0?numOr(row[iNeto]):null
        });
      }
      if(rows.length){
        if(/REVEND/i.test(name) && !rev){ rev=rows; }
        else if(!primary){ primary=rows; }
      }
    }
    // intento hoja tipo LISTA SUPERMERCADO (COD LUCAS + CODIGO BARRA)
    const hIdx2=findHeaderRow(aoa,[['CODLUCAS','COD'],['CODIGOBARRA','EAN']]);
    if(hIdx2>=0 && !superList){
      const header=aoa[hIdx2];
      const iCod=findCol(header,['CODLUCAS','COD']);
      const iEan=findCol(header,['CODIGOBARRA','EAN'],[iCod]);
      const iSinIva=findCol(header,['PRECIOSINIVA'],[iCod,iEan]);
      const rows=[];
      for(let r=hIdx2+1;r<aoa.length;r++){
        const row=aoa[r]; if(!row) continue;
        const cod=row[iCod]; if(cod===undefined||cod===null||cod===''||isNaN(Number(cod))) continue;
        rows.push({cod:Number(cod), ean:iEan>=0&&row[iEan]?String(row[iEan]).trim():null, precioSinIva:iSinIva>=0?numOr(row[iSinIva]):null});
      }
      if(rows.length) superList=rows;
    }
  });
  if(!primary) return null;
  const revMap={}; (rev||[]).forEach(r=>revMap[r.cod]={margenRev:r.margen,netoRevOriginal:r.netoOriginal});
  const superMap={}; (superList||[]).forEach(r=>superMap[r.cod]=r);
  let eanCount=0, revCount=0;
  const esFraccionValida=v=>isFinite(v)&&Math.abs(v)<=1.5;
  const items=primary.map(it=>{
    const rv=revMap[it.cod]; const sp=superMap[it.cod];
    if(rv)revCount++;
    if(sp&&sp.ean)eanCount++;
    // Algunos artículos (ej. marca propia DON YEYO) usan en el Excel una fórmula distinta
    // para Desc.1/Desc.2 que NO es un porcentaje — si detectamos un valor fuera de rango,
    // no confiamos en el desglose y usamos directamente el Neto ya calculado por el Excel.
    let desc1=it.desc1, desc2=it.desc2, netoOverride=null;
    if(!esFraccionValida(desc1)||!esFraccionValida(desc2)){
      if(!esFraccionValida(desc1))desc1=0;
      if(!esFraccionValida(desc2))desc2=0;
      // Si ya sabemos qué fórmula real usa este proveedor (ver FORMULA_DEFAULT_POR_PROV), la dejamos
      // recalcular en vivo con esa fórmula en vez de congelar el Neto que traía el Excel — así el precio
      // se actualiza solo cuando cambia el Costo. Si es un proveedor no identificado, usamos el Neto
      // del Excel como respaldo de seguridad para no mostrar un precio inventado.
      if(!FORMULA_DEFAULT_POR_PROV[normKey(it.prov)] && it.netoOriginal!=null && isFinite(it.netoOriginal)){
        netoOverride=it.netoOriginal;
      }
    }
    return {
      cod:it.cod, prov:it.prov, articulo:it.articulo, ean: sp?sp.ean:null,
      costo:it.costo, desc1, desc2, margen:it.margen,
      margenRev: rv? rv.margenRev : null,
      precioSinIvaSuper: sp? sp.precioSinIva : null,
      neto:netoOverride /* override manual o de seguridad; null = usar calculado */,
      fechaActualizado:null
    };
  });
  return {items,revCount,eanCount};
}

/* ============================================================
   MAESTRO — IMPORTAR EXCEL DE ARTÍCULOS DE CHESS (puente de EAN)
============================================================ */
function handleArticulosFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const result=parseArticulosChessWorkbook(wb);
      if(!result||!result.count){
        toast('No reconocí columnas Código / Descripción / Cód. Barra en ese archivo.');
        return;
      }
      aplicarArticulosComoBase(result,file.name);
      renderMaestro();
    }catch(err){console.error(err);toast('Error leyendo el archivo: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}
function parseArticulosChessWorkbook(wb){
  let byCod={}, count=0, eanCount=0, anulados=[], hasAnuladoCol=false;
  wb.SheetNames.forEach(name=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null,raw:true});
    const hIdx=findHeaderRow(aoa,[['CODIGO'],['DESCRIPCION'],['CODBARRAUNIDAD','CODBARRABULTO']]);
    if(hIdx<0)return;
    const header=aoa[hIdx];
    const iCod=findCol(header,['CODIGO']);
    const iDesc=findCol(header,['DESCRIPCION'],[iCod]);
    const iBarraBulto=findCol(header,['CODBARRABULTO'],[iCod,iDesc]);
    const iBarraUnidad=findCol(header,['CODBARRAUNIDAD'],[iCod,iDesc,iBarraBulto]);
    const iProv=findCol(header,['RAZONSOCIAL'],[iCod,iDesc,iBarraBulto,iBarraUnidad]);
    const iCodProv=findCol(header,['CODARTICULOPROVEEDOR'],[iCod,iDesc,iBarraBulto,iBarraUnidad,iProv]);
    const iAnul=findCol(header,['ANULADO'],[iCod,iDesc]);
    if(iAnul>=0)hasAnuladoCol=true;
    for(let r=hIdx+1;r<aoa.length;r++){
      const row=aoa[r]; if(!row)continue;
      const cod=row[iCod]; if(cod===undefined||cod===null||cod===''||isNaN(Number(cod)))continue;
      if(iAnul>=0){
        const av=String(row[iAnul]==null?'':row[iAnul]).trim().toUpperCase();
        if(av==='SI'||av==='SÍ'||av==='S'||av==='TRUE'||av==='1'||row[iAnul]===true){ anulados.push(Number(cod)); continue; }
      }
      const ean=(iBarraUnidad>=0&&row[iBarraUnidad])?String(row[iBarraUnidad]).trim():(iBarraBulto>=0&&row[iBarraBulto]?String(row[iBarraBulto]).trim():null);
      byCod[Number(cod)]={ean, desc:iDesc>=0&&row[iDesc]!=null?String(row[iDesc]).trim():'', razonSocial:iProv>=0?row[iProv]:null, codArtProv:iCodProv>=0?row[iCodProv]:null};
      count++; if(ean)eanCount++;
    }
  });
  return {byCod,count,eanCount,anulados,hasAnuladoCol};
}
// Nombre corto del proveedor a partir de la Razón Social de Chess (saca S.A., S.R.L., etc.)
function nombreProvCorto(rs){
  let t=String(rs==null?'':rs).toUpperCase().replace(/\s+/g,' ').trim();
  if(!t||t==='0')return 'SIN PROVEEDOR';
  const forma=/[\s,]+(S\.?\s?R\.?\s?L\.?|S\.?\s?A\.?\s?S\.?|S\.?\s?A\.?|S\.?\s?C\.?\s?A\.?|SACIF.*|SACI.*)\s*$/;
  for(let i=0;i<3&&forma.test(t);i++)t=t.replace(forma,'').trim();
  return t||'SIN PROVEEDOR';
}
// El Excel de Artículos de Chess es la BASE del maestro (solo activos). Costos, descuentos y márgenes
// que ya estaban cargados, y los rubros, se conservan por código; los artículos nuevos arrancan sin costo.
function construirMaestroDesdeArticulos(result,fileName){
  const previos={};
  if(MAESTRO&&MAESTRO.items)MAESTRO.items.forEach(i=>{previos[i.cod]=i;});
  let nuevos=0;
  const items=Object.keys(result.byCod).map(k=>{
    const cod=Number(k), a=result.byCod[k], pv=previos[cod];
    if(pv){
      return Object.assign({},pv,{articulo:a.desc||pv.articulo, ean:a.ean||pv.ean||null,
        prov: (pv.prov&&pv.prov!=='SIN PROVEEDOR')?pv.prov:nombreProvCorto(a.razonSocial)});
    }
    nuevos++;
    return {cod, prov:nombreProvCorto(a.razonSocial), articulo:a.desc||('Artículo '+cod), ean:a.ean||null,
      costo:0, desc1:0, desc2:0, margen:0, margenRev:null, precioSinIvaSuper:null, neto:null, fechaActualizado:null, rubro:null};
  }).sort((x,y)=>x.cod-y.cod);
  const quitados=Object.keys(previos).filter(c=>!result.byCod[c]).length;
  MAESTRO={items, fecha:new Date().toISOString(), fuente:fileName+' (Chess)', revCount:items.filter(i=>i.margenRev!=null).length,
    eanCount:items.filter(i=>i.ean).length, fuenteArticulos:fileName, fechaArticulos:new Date().toISOString(), baseChess:true};
  saveMaestro(MAESTRO);
  return {total:items.length,nuevos,quitados};
}
function aplicarArticulosComoBase(result,fileName){
  ARTICULOS_DATA={byCod:result.byCod,fuente:fileName,count:result.count,eanCount:result.eanCount};
  guardarAnuladosDeArchivo(result);
  const r=construirMaestroDesdeArticulos(result,fileName);
  const sinCosto=MAESTRO.items.filter(i=>!i.costo).length;
  guardarVersionMaestro('Base de artículos: '+fileName);
  toast('Maestro armado desde Chess: '+r.total+' artículos activos ('+(result.anulados?result.anulados.length:0)+' anulados quedaron afuera'+(r.quitados?', '+r.quitados+' que ya no están se sacaron':'')+'). Sin costo todavía: '+sinCosto+' — se completan con "Cargar proveedor".');
}
// Quita del maestro los artículos anulados en Chess (columna "Anulado" = SI). Devuelve cuántos sacó.
let ultimosAnuladosQuitados=0;
function aplicarAnulados(){
  ultimosAnuladosQuitados=0;
  if(!MAESTRO||!MAESTRO.items||!ANULADOS.length)return 0;
  const set=new Set(ANULADOS);
  const antes=MAESTRO.items.length;
  MAESTRO.items=MAESTRO.items.filter(it=>!set.has(it.cod));
  ultimosAnuladosQuitados=antes-MAESTRO.items.length;
  if(ultimosAnuladosQuitados)saveMaestro(MAESTRO);
  return ultimosAnuladosQuitados;
}
function textoAnulados(){ return ultimosAnuladosQuitados? ' · '+ultimosAnuladosQuitados+' anulados quedaron afuera':''; }
function guardarAnuladosDeArchivo(result){
  if(result&&result.hasAnuladoCol){ ANULADOS=result.anulados.slice(); saveAnulados(ANULADOS); }
}
function mergeArticulos(){
  if(!MAESTRO||!ARTICULOS_DATA)return;
  aplicarAnulados();
  let eanCount=0;
  MAESTRO.items.forEach(it=>{
    const a=ARTICULOS_DATA.byCod[it.cod];
    if(a){
      if(a.ean)it.ean=a.ean;
      if(a.razonSocial)it.provChess=a.razonSocial;
      if(a.codArtProv)it.codProveedorChess=a.codArtProv;
    }
    if(it.ean)eanCount++;
  });
  MAESTRO.eanCount=eanCount;
  MAESTRO.fuenteArticulos=ARTICULOS_DATA.fuente;
  MAESTRO.fechaArticulos=new Date().toISOString();
  saveMaestro(MAESTRO);
}

function asegurarRubro(nombre){
  if(!nombre)return;
  if(!RUBROS.some(r=>normText(r)===normText(nombre))){
    RUBROS.push(nombre); RUBROS.sort((a,b)=>a.localeCompare(b,'es'));
    saveRubros(RUBROS);
  }
}

// Pide el nombre de un rubro nuevo en un cuadro propio (prompt() del navegador está bloqueado en muchos entornos)
function pedirRubroNuevo(onOk,onCancel){

function asignarRubroItem(cod,valor){
  const it=MAESTRO.items.find(i=>i.cod===cod); if(!it)return;
  if(valor==='__nuevo__'){
    pedirRubroNuevo(t=>asignarRubroItem(cod,t),()=>renderMaestro());
    return;
  }
  it.rubro=valor||null;
  saveMaestro(MAESTRO);
  toast('Rubro actualizado');
  renderMaestro();
}
function maestroFiltrados(){
  if(!MAESTRO||!MAESTRO.items)return [];
  const words=normText(maestroFilter).split(/\s+/).filter(Boolean);
  let items=MAESTRO.items;
  if(words.length) items=items.filter(it=>{
    const hay=normText(it.articulo)+' '+normText(it.prov)+' '+String(it.cod)+' '+normText(it.rubro||'');
    return words.every(w=>hay.includes(w));
  });
  if(maestroRubroFiltro==='__sin__') items=items.filter(it=>!it.rubro);
  else if(maestroRubroFiltro) items=items.filter(it=>it.rubro===maestroRubroFiltro);
  return items;
}

  it.desc1=fromPct(document.getElementById('edDesc1').value);
  it.desc2=fromPct(document.getElementById('edDesc2').value);
  const mr=document.getElementById('edMargenRev').value;
  it.margenRev= mr===''?null:fromPct(mr);
  it.ean=document.getElementById('edEan').value.trim()||null;
  let rubroVal=document.getElementById('edRubro').value;
  if(rubroVal==='__nuevo__'){
    const t=(document.getElementById('edRubroNuevo').value||'').trim();
    if(t){
      const ex=RUBROS.find(r=>normText(r)===normText(t));
      rubroVal=ex||t; asegurarRubro(rubroVal);
    }else rubroVal=it.rubro||'';
  }
  it.rubro=rubroVal||null;
  saveMaestro(MAESTRO);
  closeModal(); toast('Artículo actualizado'); renderMaestro();
}

function handleProveedorFile(file){
  if(!file)return;
  if(!proveedorElegido())return;
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='pdf'){
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const lines=await extraerLineasPDF(e.target.result);
        iniciarCargaDesdeLineas(lines,file.name);
      }catch(err){console.error(err);showErrP('No pude leer el PDF: '+err.message);}
    };
    reader.readAsArrayBuffer(file);
  }else{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const items=parseProveedorExcel(wb);
        if(!items.length){showErrP('No reconocí columnas de artículo/precio en el Excel.');return;}
        finalizarParseo(items,file.name);
      }catch(err){console.error(err);showErrP('Error leyendo el Excel: '+err.message);}
    };
    reader.readAsArrayBuffer(file);
  }
}
function showErrP(msg){const el=document.getElementById('errBoxP');if(el){el.style.display='block';el.textContent='⚠ '+msg;}}

async function extraerLineasPDF(buf){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const allLines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    const items=content.items.map(it=>({str:it.str,x:it.transform[4],y:Math.round(it.transform[5])}));
    const rows={};
    items.forEach(it=>{const key=Math.round(it.y/2)*2; (rows[key]=rows[key]||[]).push(it);});
    const ys=Object.keys(rows).map(Number).sort((a,b)=>b-a);
    ys.forEach(y=>{
      const line=rows[y].sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
      if(line)allLines.push(line);
    });
  }
  return allLines;
}

function iniciarCargaDesdeLineas(lines,fuente){
  const items=[];
  lines.forEach(line=>{
    const parsed=parseLineaProveedor(line);
    if(parsed)items.push(parsed);
  });
  if(!items.length){showErrP('No pude reconocer ninguna línea con el patrón Código·EAN·Descripción·Precios. Revisá el texto o probá con el Excel del proveedor.');return;}
  finalizarParseo(items,fuente);
}

function parseLineaProveedor(line){
  const toks=line.split(' ').filter(Boolean);
  if(toks.length<4)return null;
  if(!/^\d{1,6}$/.test(toks[0]))return null;
  if(!/^\d{6,14}$/.test(toks[1]))return null;
  const codigoProv=toks[0], ean=toks[1];
  let markerIdx=-1,pesable=null;
  for(let i=2;i<toks.length;i++){
    if(toks[i]==='Pesable'){markerIdx=i;pesable=true;break;}
    if(toks[i]==='No'&&toks[i+1]==='Pesable'){markerIdx=i;pesable=false;break;}
  }
  if(markerIdx===-1)return null;
  const descripcion=toks.slice(2,markerIdx).join(' ');
  const afterIdx=pesable?markerIdx+1:markerIdx+2;
  const rest=toks.slice(afterIdx);
  let bulto=null;const precios=[];
  rest.forEach(t=>{
    if(/^\d{1,4}$/.test(t)){ if(bulto===null)bulto=parseInt(t,10); }
    else{ const n=parseArNumber(t); if(!isNaN(n))precios.push(n); }
  });
  return {codigoProv,ean,descripcion,pesable,bulto,precioNeto:precios[0]??null,precioUnidad:precios[1]??null,precioSugerido:precios[2]??null};
}

function parseProveedorExcel(wb){
  let out=[];
  wb.SheetNames.forEach(name=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null,raw:true});
    const hIdx=findHeaderRow(aoa,[['DESCRIPCION','ARTICULO'],['PRECIO','COSTO','NETO']]);
    if(hIdx<0)return;
    const header=aoa[hIdx];
    const iCod=findCol(header,['CODIGO','COD']);
    const iEan=findCol(header,['EAN','CODIGOBARRA','CODBARRA'],[iCod]);
    const iDesc=findCol(header,['DESCRIPCION','ARTICULO'],[iCod,iEan]);
    const iPrecio=findCol(header,['PRECIONETO','PRECIO','COSTO'],[iCod,iEan,iDesc]);
    const iUnidad=findCol(header,['PRECIOPORUNIDAD','PRECIOUNIDAD'],[iCod,iEan,iDesc,iPrecio]);
    for(let r=hIdx+1;r<aoa.length;r++){
      const row=aoa[r]; if(!row)continue;
      const desc=iDesc>=0?row[iDesc]:null; if(!desc)continue;
      out.push({
        codigoProv:iCod>=0?String(row[iCod]||'').trim():'', ean:iEan>=0&&row[iEan]?String(row[iEan]).trim():null,
        descripcion:String(desc).trim(), pesable:null,bulto:null,
        precioNeto:iPrecio>=0?numOr(row[iPrecio]):null, precioUnidad:iUnidad>=0?numOr(row[iUnidad]):null, precioSugerido:null
      });
    }
  });
  return out;
}

function finalizarParseo(items,fuente){
  // matchear contra maestro
  // Solo se empareja contra los artículos del proveedor elegido
  const candidatos=MAESTRO.items.filter(m=>m.prov===cargaProvSel);
  const eanIndex={}; candidatos.forEach(m=>{if(m.ean)eanIndex[m.ean]=m;});
  const mapKeyPrefix=(prov,desc)=>normKey(prov)+'|'+normText(desc);
  const proveedorGuess = cargaProvSel;
  const matched=items.map(raw=>{
    let cod=null, score=0, method='';
    // 1. mapa persistente
    const mapKey=mapKeyPrefix(proveedorGuess,raw.descripcion);
    if(MAPDB[mapKey]!==undefined){
      const m=candidatos.find(x=>x.cod===MAPDB[mapKey]);
      if(m){cod=m.cod;score=1;method='memoria';}
    }
    // 2. EAN
    if(cod===null && raw.ean && eanIndex[raw.ean]){cod=eanIndex[raw.ean].cod;score=1;method='EAN';}
    // 3. texto exacto
    if(cod===null){
      const exact=candidatos.find(m=>normText(m.articulo)===normText(raw.descripcion));
      if(exact){cod=exact.cod;score=1;method='texto exacto';}
    }
    // 4. fuzzy
    if(cod===null){
      let best=null,bestScore=0;
      candidatos.forEach(m=>{const s=jaccard(m.articulo,raw.descripcion);if(s>bestScore){bestScore=s;best=m;}});
      if(best&&bestScore>=0.4){cod=best.cod;score=bestScore;method='similar';}
    }
    const costoElegido = raw.precioUnidad!=null&&raw.precioUnidad>0 ? raw.precioUnidad : raw.precioNeto;
    return {raw,matchCod:cod,matchScore:score,method,nuevoCosto:costoElegido,usarUnidad: raw.precioUnidad!=null&&raw.precioUnidad>0, usar: cod!==null};
  });
  CARGA_STATE={proveedor:proveedorGuess,fuente,items:matched};
  renderCarga();
}
function guessProveedorNombre(items){
  // usa la descripción más común para deducir la marca al final del texto
  const last=(items[0]||{}).descripcion||'';
  const toks=last.split(' ');
  return toks[toks.length-1] || 'PROVEEDOR';
}

function confirmarAplicar(){
  const st=CARGA_STATE;
  const aplicar=st.items.filter(i=>i.usar&&i.matchCod!==null&&i.nuevoCosto!=null);
  if(!aplicar.length){toast('No hay cambios seleccionados para aplicar');return;}
  if(!confirm('Vas a actualizar el costo de '+aplicar.length+' artículos. ¿Confirmar?'))return;
  const detalle=[];
  aplicar.forEach(a=>{
    const m=MAESTRO.items.find(x=>x.cod===a.matchCod);
    if(!m)return;
    detalle.push({cod:m.cod,articulo:m.articulo,costoAnterior:m.costo,costoNuevo:a.nuevoCosto});
    m.costo=a.nuevoCosto;
    m.fechaActualizado=new Date().toISOString();
    // guardar match en memoria aunque haya sido automático, para reforzar
    const mapKey=normKey(st.proveedor)+'|'+normText(a.raw.descripcion);
    MAPDB[mapKey]=m.cod;
  });
  saveMaestro(MAESTRO); saveMap(MAPDB);
  guardarVersionMaestro('Lista de proveedor: '+st.proveedor+' ('+st.fuente+')');
  const variaciones=detalle.filter(d=>d.costoAnterior>0).map(d=>(d.costoNuevo-d.costoAnterior)/d.costoAnterior);
  const variacionProm=variaciones.length? variaciones.reduce((a,b)=>a+b,0)/variaciones.length : 0;
  HIST.unshift({id:uid(),fecha:new Date().toISOString(),proveedor:st.proveedor,fuente:st.fuente,cantidad:detalle.length,variacionPromedio:variacionProm,detalle});
  saveHist(HIST);

  CARGA_STATE=null; cargaProvSel='';

  margenProv=provAplicado; margenFiltro='all'; margenBusq=''; margenDetalle=true;

}

function editMargenCampo(cod,campo,valor){
  const it=MAESTRO.items.find(i=>i.cod===cod); if(!it)return;
  it[campo]= campo==='costo'? numOr(valor) : fromPct(valor);
  it.fechaActualizado=new Date().toISOString();
  if(campo==='desc1'||campo==='desc2'){ recordarDescuento(it.prov,it.desc1,it.desc2); }
  if(campo==='margen'){ it.neto=null; } // si se edita el margen a mano, se deja de forzar un Neto viejo
  saveMaestro(MAESTRO);
  renderMargenes();
}
// Dado un Neto que el usuario quiere lograr (por ej. a partir de Lista 1), calcula qué Margen lo produce,
// invirtiendo la fórmula activa del proveedor. Para las 4 fórmulas predefinidas la inversión es exacta;
// para una fórmula personalizada se usa una aproximación genérica tipo "recargo sobre costo".
function invertMargenDesdeNeto(it,netoDeseado){
  const costo=it.costo||0, d1=it.desc1||0, d2=it.desc2||0;
  const f=getFormulaCfg(it.prov);
  const parcial1=evalFormulaExpr(f.parcial1,{COSTO:costo,DESC1:d1,DESC2:d2,MARGEN:0});
  const parcial2=evalFormulaExpr(f.parcial2,{COSTO:costo,DESC1:d1,DESC2:d2,MARGEN:0,PARCIAL1:parcial1});
  if(!parcial2)return it.margen||0;
  if(f.id==='estandar'||f.id==='suma_recargo'){
    return (netoDeseado/parcial2)-1;
  }
  if(f.id==='encadenado_venta'||f.id==='suma_venta'){
    return netoDeseado? 1-(parcial2/netoDeseado) : 0;
  }
  // fórmula personalizada: aproximación genérica (recargo sobre costo final)
  return (netoDeseado-parcial2)/parcial2;
}
function redondearArriba(v){
  if(!v||v<=0)return v;
  let paso;
  if(v<100)paso=1; else if(v<1000)paso=10; else if(v<10000)paso=50; else paso=100;
  return Math.ceil(v/paso)*paso;
}
function editListaCampo(cod,valor){
  const it=MAESTRO.items.find(i=>i.cod===cod); if(!it)return;
  const l1=numOr(valor);
  if(!l1||l1<=0){toast('Ingresá un precio de Lista 1 válido');renderMargenes();return;}
  const ivaFrac=(CFG.listas.iva||0)/100;
  const netoDeseado=l1/(1+ivaFrac);
  it.margen=invertMargenDesdeNeto(it,netoDeseado);
  it.neto=null; // el margen ya refleja el precio pedido; no forzamos un neto aparte
  it.fechaActualizado=new Date().toISOString();
  saveMaestro(MAESTRO);
  toast('✓ Margen recalculado a partir de Lista 1');
  renderMargenes();
}
function redondearLista(cod){
  const it=MAESTRO.items.find(i=>i.cod===cod); if(!it)return;
  const c=calcItem(it);
  const netoActual=it.neto!=null?it.neto:c.neto;
  const l1=netoActual*(1+(CFG.listas.iva||0)/100);
  const l1r=redondearArriba(l1);
  editListaCampo(cod,l1r);
}
function aplicarCostoMasivo(){
  const pct=numOr(document.getElementById('bulkPct').value);
  if(!pct){toast('Ingresá un porcentaje distinto de cero');return;}
  const afectados=MAESTRO.items.filter(i=>i.prov===margenProv);
  if(!afectados.length){toast('No hay artículos de ese proveedor');return;}
  if(!confirm(`Vas a ${pct>0?'aumentar':'reducir'} el costo ${Math.abs(pct)}% de ${afectados.length} artículos de ${margenProv}. ¿Confirmar?`))return;
  const detalle=[];
  afectados.forEach(it=>{
    const costoAnterior=it.costo;
    it.costo=+(it.costo*(1+pct/100)).toFixed(4);
    it.fechaActualizado=new Date().toISOString();
    detalle.push({cod:it.cod,articulo:it.articulo,costoAnterior,costoNuevo:it.costo});
  });
  saveMaestro(MAESTRO);
  guardarVersionMaestro('Actualización masiva '+pct+'% · '+margenProv);
  HIST.unshift({id:uid(),fecha:new Date().toISOString(),proveedor:margenProv,fuente:'actualización masiva '+pct+'%',cantidad:detalle.length,variacionPromedio:pct/100,detalle});
  saveHist(HIST);
  document.getElementById('navH').textContent=HIST.length;
  toast('✓ Costo actualizado en '+detalle.length+' artículos');
  renderMargenes();
}
function aplicarDescuentoMasivo(){
  const d1=document.getElementById('bulkDesc1').value, d2=document.getElementById('bulkDesc2').value;
  if(d1===''&&d2===''){toast('Ingresá al menos un descuento');return;}
  const afectados=MAESTRO.items.filter(i=>i.prov===margenProv);
  if(!afectados.length){toast('No hay artículos de ese proveedor');return;}
  if(!confirm(`Vas a aplicar Desc.1 ${d1?d1+'%':'(sin cambio)'} · Desc.2 ${d2?d2+'%':'(sin cambio)'} a ${afectados.length} artículos de ${margenProv}. ¿Confirmar?`))return;
  afectados.forEach(it=>{
    if(d1!=='')it.desc1=fromPct(d1);
    if(d2!=='')it.desc2=fromPct(d2);
    it.fechaActualizado=new Date().toISOString();
  });
  saveMaestro(MAESTRO);
  recordarDescuento(margenProv, d1!==''?fromPct(d1):afectados[0].desc1, d2!==''?fromPct(d2):afectados[0].desc2);
  toast('✓ Descuento aplicado a '+afectados.length+' artículos');
  renderMargenes();
}

function previewFormula(p1expr,p2expr,netoExpr){
  const vars={COSTO:1000,DESC1:0.10,DESC2:0.05,MARGEN:0.20};
  const p1=evalFormulaExpr(p1expr,vars);
  const p2=evalFormulaExpr(p2expr,Object.assign({},vars,{PARCIAL1:p1}));
  const neto=evalFormulaExpr(netoExpr,Object.assign({},vars,{PARCIAL1:p1,PARCIAL2:p2}));
  return {p1,p2,neto};
}

function exportarSoloModificados(){

function descargarXLSX(rows,filename){
  const ws=XLSX.utils.aoa_to_sheet(rows);

  XLSX.writeFile(wb,filename);
}

function cfgNuevoRubro(){

}
function cfgRenombrarRubro(i){
  const viejo=RUBROS[i]; if(viejo===undefined)return;
  pedirTexto('Renombrar rubro','Nuevo nombre',viejo,t=>{
    if(t===viejo)return;
    const otro=RUBROS.find(r=>r!==viejo&&normText(r)===normText(t));
    const nuevo=otro||t;
    if(otro&&!confirm(`Ya existe "${otro}". ¿Unir "${viejo}" con ese rubro?`))return;
    ((MAESTRO&&MAESTRO.items)||[]).forEach(it=>{ if(it.rubro===viejo)it.rubro=nuevo; });
    if(MAESTRO)saveMaestro(MAESTRO);
    RUBROS=RUBROS.filter(r=>r!==viejo);
    asegurarRubro(nuevo);
    saveRubros(RUBROS);
    if(maestroRubroFiltro===viejo)maestroRubroFiltro=nuevo;
    toast('Rubro actualizado');
    refrescarRubrosCfg();
  });
}
function cfgBorrarRubro(i){
  const r=RUBROS[i]; if(r===undefined)return;
  const n=((MAESTRO&&MAESTRO.items)||[]).filter(it=>it.rubro===r).length;
  if(!confirm(`¿Borrar el rubro "${r}"?`+(n?` Los ${n} artículos que lo tienen quedan sin rubro.`:'')))return;
  ((MAESTRO&&MAESTRO.items)||[]).forEach(it=>{ if(it.rubro===r)it.rubro=null; });
  if(MAESTRO)saveMaestro(MAESTRO);
  RUBROS=RUBROS.filter((x,k)=>k!==i);
  saveRubros(RUBROS);
  if(maestroRubroFiltro===r)maestroRubroFiltro='';
  toast('Rubro borrado');
  refrescarRubrosCfg();
}

function primerDiaMes(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);}
function ultimoDiaMes(){const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);}
function provsDisponibles(){return MAESTRO&&MAESTRO.items?[...new Set(MAESTRO.items.map(i=>i.prov).filter(Boolean))].sort():[];}
function loadMeta(){
  let m; try{const s=localStorage.getItem(LS_OFERTA_META); m=s?JSON.parse(s):null;}catch{m=null;}
  if(!m)m={};
  if(!m.desde)m.desde=primerDiaMes();
  if(!m.hasta)m.hasta=ultimoDiaMes();
  if(!m.promosVolumen)m.promosVolumen=[];
  if(!m.marcaSeleccionada){const provs=provsDisponibles();m.marcaSeleccionada=provs.includes('DON YEYO')?'DON YEYO':(provs[0]||'');}
  return m;
}
function saveMeta(m){localStorage.setItem(LS_OFERTA_META,JSON.stringify(m));}
function migrarObjetivo(o){
  let codigos=o.codigos;
  if(typeof codigos==='string') codigos=codigos.split(',').map(s=>Number(s.trim())).filter(n=>!isNaN(n));
  if(!Array.isArray(codigos)) codigos=[];
  return {
    marca:o.marca||o.prov||'',
    codigos,
    objetivoValor:o.objetivoValor!=null?o.objetivoValor:(o.objetivoCajas!=null?o.objetivoCajas:0),
    objetivoUnidad:o.objetivoUnidad||(o.objetivoCajas!=null?'cajas':''),
    recompensaValor:o.recompensaValor!=null?o.recompensaValor:(o.recompensaPct!=null?o.recompensaPct:0),
    recompensaTipo:o.recompensaTipo||'%',
    vigenciaDesde:o.vigenciaDesde||'',
    vigenciaHasta:o.vigenciaHasta||''
  };
}
function loadObjetivos(){
  try{
    const s=localStorage.getItem(LS_OBJETIVOS);
    if(!s)return [];
    let arr=JSON.parse(s);
    let migrado=false;
    arr=arr.map(o=>{
      if(typeof o.codigos==='string'||o.prov!=null||o.objetivoCajas!=null||o.recompensaPct!=null||o.mes!=null){migrado=true;return migrarObjetivo(o);}
      return o;
    });
    if(migrado){try{localStorage.setItem(LS_OBJETIVOS,JSON.stringify(arr));}catch{}}
    return arr;
  }catch{return [];}
}
function saveObjetivos(o){localStorage.setItem(LS_OBJETIVOS,JSON.stringify(o));}

  if(o.modo==='precio'){
    const precioDef = o.precioOferta!=null? o.precioOferta : 0;
    const margenReal = it.costo? ((precioDef-it.costo)/it.costo*100) : 0;
    camposModo=`
      <label class="fld" style="font-size:9px">Costo<div class="mn" style="padding-top:4px">${fmtMoney(it.costo)}</div></label>

      <label class="fld" style="font-size:9px">P. Público<input type="number" step="0.01" value="${pPub.toFixed(2)}" style="width:90px" onchange="editarOfertaCampo(${o.cod},'precioPublico',this.value)"></label>
      <span class="cb-sub" style="align-self:center">${margenReal.toFixed(1)}% margen</span>`;
  }else{ // vencimiento — misma info que descuento, más fecha
    const pDist=it.costo*(1-(o.descuentoPct||0)/100);
    const pPub = o.precioPublico!=null? o.precioPublico : pDist*(1+(o.margenPublico||0)/100);
    const margenReal = pDist? ((pPub-pDist)/pDist*100) : 0;
    camposModo=`
      <label class="fld" style="font-size:9px">Costo<div class="mn" style="padding-top:4px">${fmtMoney(it.costo)}</div></label>
      <label class="fld" style="font-size:9px">Desc. %<input type="number" step="0.1" value="${o.descuentoPct||0}" style="width:70px" onchange="editarOfertaCampo(${o.cod},'descuentoPct',this.value)"></label>

function agregarOferta(cod){
  if(OFERTAS.find(o=>o.cod===cod)){toast('Ya está en la oferta');return;}
  const it=MAESTRO.items.find(i=>i.cod===cod);
  const l=calcListas(it);
  const modoDefault = ofertaDestino==='marca'?'descuento':'precio';
  const nuevo={cod,modo:modoDefault};
  if(modoDefault==='descuento'){ nuevo.descuentoPct=12; nuevo.margenPublico=38; nuevo.precioPublico=null; }
  else{ nuevo.precioOferta=+(l.l1*0.9).toFixed(2); }
  OFERTAS.push(nuevo);
  saveOfertas(OFERTAS);
  toast('Agregado a ofertas');
  ofertaBusq=''; renderOfertas();
}
function cambiarModoOferta(cod,modo){
  const o=OFERTAS.find(x=>x.cod===cod); if(!o)return;
  const it=MAESTRO.items.find(i=>i.cod===cod);
  o.modo=modo;
  if((modo==='descuento'||modo==='vencimiento')&&o.descuentoPct==null){o.descuentoPct=12;o.margenPublico=38;}
  if(modo==='precio'&&o.precioOferta==null){
    const l=it?calcListas(it):null;
    o.precioOferta = l&&isFinite(l.l1)? +(l.l1*0.9).toFixed(2) : (it?it.costo:0);
  }
  saveOfertas(OFERTAS); renderOfertas();
}
function editarOfertaCampo(cod,campo,valor){
  const o=OFERTAS.find(x=>x.cod===cod); if(!o)return;
  o[campo]= campo==='fechaVencimiento'? valor : numOr(valor);
  saveOfertas(OFERTAS);
  renderOfertas();
}
function quitarOferta(cod){OFERTAS=OFERTAS.filter(o=>o.cod!==cod);saveOfertas(OFERTAS);renderOfertas();}

function decodeTexto(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
  catch{return new TextDecoder('iso-8859-1').decode(buf);}
}
function detectarDelimitador(linea){return linea.includes('\t')?'\t':(linea.includes(';')?';':',');}
function textoATablaAOA(texto){
  const lineas=texto.split(/\r\n|\n|\r/).filter(l=>l.length);
  if(!lineas.length)return [];
  const delim=detectarDelimitador(lineas[0]);
  return lineas.map(l=>l.split(delim));
}
const MESES_AR={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,set:8,oct:9,nov:10,dic:11};
function parsePeriodoAr(txt){
  const m=String(txt||'').toLowerCase().match(/([a-záéíóúñ]{3,10})[.\-\s]*'?\s*(\d{2,4})/i);
  if(!m)return null;
  const mesTxt=m[1].slice(0,3).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const mes=MESES_AR[mesTxt]; if(mes===undefined)return null;
  let anio=parseInt(m[2],10); if(anio<100)anio+=2000;
  return {mes,anio};
}

function handleVentasFile(file){
  if(!file)return;
  const ext=file.name.split('.').pop().toLowerCase();
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      let parsed;
      if(ext==='csv'||ext==='txt'){
        const texto=decodeTexto(e.target.result);
        const aoa=textoATablaAOA(texto);
        parsed=procesarAOAVentas(aoa);
      }else{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        parsed=null;
        wb.SheetNames.forEach(name=>{
          const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null,raw:true});
          const r=procesarAOAVentas(aoa);
          if(r&&r.items.length){ if(!parsed)parsed=r; else parsed.items=parsed.items.concat(r.items); }
        });
      }
      if(!parsed||!parsed.items.length){showErrV('No reconocí columnas de Artículo / Importe / Fecha (o Período) en ese archivo.');return;}
      VENTAS={items:parsed.items,fecha:new Date().toISOString(),fuente:file.name,rangoDesde:parsed.rangoDesde,rangoHasta:parsed.rangoHasta};
      saveVentas(VENTAS);
      guardarResumenMes();
      toast('Ventas cargadas: '+parsed.items.length+' líneas');
      renderTablero();
    }catch(err){console.error(err);showErrV('Error leyendo el archivo: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}
function showErrV(msg){const el=document.getElementById('errBoxV');if(el){el.style.display='block';el.textContent='⚠ '+msg;}}

function procesarAOAVentas(aoa){
  // Formato 1: filas planas (una venta por fila) con columnas Articulo/Importe/Fecha
  const hIdx=findHeaderRow(aoa,[['ARTICULO','CODIGO'],['IMPORTE','IMPORTENETO'],['FECHA']]);
  if(hIdx>=0) return procesarFormatoPlano(aoa,hIdx);
  // Formato 2: "cubo" de Chess — columnas repetidas por dimensión (Código/Descripción por cada eje), sin fecha diaria, con Período
  return procesarFormatoCubo(aoa);
}

function procesarFormatoPlano(aoa,hIdx){
  const header=aoa[hIdx];
  const iArt=findCol(header,['ARTICULO','CODIGO']);
  const iDesc=findCol(header,['DESCRIPCIONARTICULO','DESCRIPCION'],[iArt]);
  const iBultos=findCol(header,['BULTOS','CANTIDAD'],[iArt,iDesc]);
  const iImporte=findCol(header,['IMPORTENETO','IMPORTE'],[iArt,iDesc,iBultos]);
  const iFecha=findCol(header,['FECHA'],[iArt,iDesc,iBultos,iImporte]);
  const iCliente=findCol(header,['DESCRIPCIONCLIENTE','CLIENTE'],[iArt,iDesc,iBultos,iImporte,iFecha]);
  const iVendedor=findCol(header,['DESCRIPCIONVENDEDOR','VENDEDOR'],[iArt,iDesc,iBultos,iImporte,iFecha,iCliente]);
  const iRechazo=findCol(header,['RECHAZOTOTAL','RECHAZO'],[iArt,iDesc,iBultos,iImporte,iFecha,iCliente,iVendedor]);
  const items=[];
  for(let r=hIdx+1;r<aoa.length;r++){
    const row=aoa[r]; if(!row)continue;
    const cod=row[iArt]; if(cod===undefined||cod===null||cod===''||isNaN(Number(cod)))continue;
    if(iRechazo>=0){const rv=String(row[iRechazo]||'').toUpperCase(); if(rv==='SI'||rv==='TRUE')continue;}
    let fecha=row[iFecha];
    if(fecha instanceof Date)fecha=fecha.toISOString();
    items.push({
      cod:Number(cod), descripcion:iDesc>=0?String(row[iDesc]||'').trim():'',
      bultos:iBultos>=0?numOr(row[iBultos]):0, importe:iImporte>=0?numOr(row[iImporte]):0,
      fecha:fecha||null, cliente:iCliente>=0?String(row[iCliente]||'').trim():'', vendedor:iVendedor>=0?String(row[iVendedor]||'').trim():''
    });
  }
  if(!items.length)return null;
  const fechas=items.map(i=>i.fecha).filter(Boolean).map(f=>new Date(f)).filter(d=>!isNaN(d));
  const rangoDesde=fechas.length?new Date(Math.min(...fechas)).toISOString():null;
  const rangoHasta=fechas.length?new Date(Math.max(...fechas)).toISOString():null;
  return {items,rangoDesde,rangoHasta};
}

function procesarFormatoCubo(aoa){
  // Busca una columna "combinada" de dimensión cuyo nombre empiece con ARTICULO (ej: "Artículos por Precio"),
  // seguida de sus columnas Código y Descripción propias.
  let hIdx=-1, iMarker=-1;
  for(let i=0;i<Math.min(aoa.length,10);i++){
    const row=(aoa[i]||[]).map(c=>normKey(c));
    const idx=row.findIndex(h=>h.startsWith('ARTICULO'));
    if(idx>=0 && row[idx+1]&&row[idx+1].startsWith('CODIGO') && row[idx+2]&&row[idx+2].startsWith('DESCRIPCION')){
      hIdx=i; iMarker=idx; break;
    }
  }
  if(hIdx<0)return null;
  const header=aoa[hIdx];
  const iCod=iMarker+1, iDesc=iMarker+2;
  const iImporte=findCol(header,['IMPORTENETO','IMPORTESNETOS','IMPORTE']);
  const iCant=findCol(header,['CANTIDADESTOTALES','CANTIDADTOTAL','CANTIDAD','BULTOS']);
  const iPeriodoDesc=findCol(header,['DESCRIPCIONPERIODO','PERIODO']);
  // primera columna "combinada" (patrón "(00000X) NOMBRE") seguida de su propio Código/Descripción, antes del marcador de artículo, se toma como vendedor
  let iVendedor=-1;
  for(let c=0;c<iMarker;c++){
    const headerSiguiente=header[c+1]?normKey(header[c+1]):'';
    if(!headerSiguiente.startsWith('CODIGO'))continue;
    const v=aoa[hIdx+1]&&aoa[hIdx+1][c];
    if(typeof v==='string'&&/^\(\d+\)/.test(v.trim())){iVendedor=c;break;}
  }
  if(iCod<0||iImporte<0)return null;
  const items=[];
  for(let r=hIdx+1;r<aoa.length;r++){
    const row=aoa[r]; if(!row)continue;
    const cod=row[iCod]; if(cod===undefined||cod===null||cod===''||isNaN(Number(cod)))continue;
    items.push({
      cod:Number(cod), descripcion:iDesc>=0?String(row[iDesc]||'').trim():'',
      bultos:iCant>=0?numOr(row[iCant]):0, importe:iImporte>=0?numOr(row[iImporte]):0,
      fecha:null, cliente:'', vendedor:iVendedor>=0?String(row[iVendedor]||'').replace(/^\(\d+\)\s*/,''):''
    });
  }
  if(!items.length)return null;
  let rangoDesde=null, rangoHasta=null;
  if(iPeriodoDesc>=0){
    const periodo=parsePeriodoAr(aoa[hIdx+1]?aoa[hIdx+1][iPeriodoDesc]:null);
    if(periodo){
      rangoDesde=new Date(periodo.anio,periodo.mes,1).toISOString();
      rangoHasta=new Date(periodo.anio,periodo.mes+1,0).toISOString();
    }
  }
  return {items,rangoDesde,rangoHasta};
}

function calcularAgregados(){
  const byProv={}; const byArt={};
  let totalImporte=0, totalBultos=0;
  VENTAS.items.forEach(v=>{
    const m=MAESTRO.items.find(x=>x.cod===v.cod);
    const prov=m?m.prov:'SIN IDENTIFICAR';
    const costoUnit=m?m.costo:null;
    totalImporte+=v.importe; totalBultos+=v.bultos;
    if(!byProv[prov])byProv[prov]={prov,importe:0,bultos:0,costoTotal:0,tieneCosto:true,articulos:new Set()};
    const bp=byProv[prov];
    bp.importe+=v.importe; bp.bultos+=v.bultos; bp.articulos.add(v.cod);
    if(costoUnit!=null)bp.costoTotal+=costoUnit*v.bultos; else bp.tieneCosto=false;

    const artKey=v.cod;
    if(!byArt[artKey])byArt[artKey]={cod:v.cod,descripcion:v.descripcion||(m?m.articulo:''),prov,importe:0,bultos:0};
    byArt[artKey].importe+=v.importe; byArt[artKey].bultos+=v.bultos;
  });
  const provList=Object.values(byProv).map(p=>{
    const margenReal = (p.tieneCosto&&p.costoTotal>0) ? (p.importe-p.costoTotal)/p.costoTotal : null;
    return Object.assign({},p,{articulos:p.articulos.size, margenReal, participacion: totalImporte? p.importe/totalImporte : 0});
  }).sort((a,b)=>b.importe-a.importe);
  const artList=Object.values(byArt).sort((a,b)=>b.importe-a.importe);
  return {provList,artList,totalImporte,totalBultos};
}

function calcularProyeccion(){
  if(!VENTAS.rangoDesde||!VENTAS.rangoHasta)return null;
  const d1=new Date(VENTAS.rangoDesde), d2=new Date(VENTAS.rangoHasta);
  const diasTranscurridos=Math.max(1,Math.round((d2-d1)/86400000)+1);
  const diasDelMes=new Date(d2.getFullYear(),d2.getMonth()+1,0).getDate();
  if(diasTranscurridos>=diasDelMes)return null; // mes ya completo, no hace falta proyectar
  const factor=diasDelMes/diasTranscurridos;
  return {diasTranscurridos,diasDelMes,factor};
}

function guardarResumenMes(){
  const {provList,totalImporte,totalBultos}=calcularAgregados();
  const mesLabel = VENTAS.rangoHasta? new Date(VENTAS.rangoHasta).toLocaleDateString('es-AR',{month:'2-digit',year:'numeric'}) : new Date().toLocaleDateString('es-AR',{month:'2-digit',year:'numeric'});
  const resumen={mesLabel,fecha:new Date().toISOString(),totalImporte,totalBultos,porProveedor:provList.map(p=>({prov:p.prov,importe:p.importe,margenReal:p.margenReal}))};
  VENTAS_HIST=VENTAS_HIST.filter(h=>h.mesLabel!==mesLabel);
  VENTAS_HIST.push(resumen);
  VENTAS_HIST.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(VENTAS_HIST.length>12)VENTAS_HIST=VENTAS_HIST.slice(-12);
  saveVentasHist(VENTAS_HIST);
}

function renderTableroDashboard(){
  const p=document.getElementById('p-tablero');
  const {provList,artList,totalImporte,totalBultos}=calcularAgregados();
  const proy=calcularProyeccion();
  const topProv=provList.slice(0,10);
  const topArt=artList.slice(0,10);
  const mesAnterior=VENTAS_HIST.length>=2?VENTAS_HIST[VENTAS_HIST.length-2]:null;
  const varMes = mesAnterior? (totalImporte-mesAnterior.totalImporte)/mesAnterior.totalImporte : null;

  p.innerHTML=`
  <div class="c-bar">
    <div><div class="cb-ttl">Tablero de Ventas</div><div class="cb-sub">${escapeHtml(VENTAS.fuente)} · ${VENTAS.rangoDesde?new Date(VENTAS.rangoDesde).toLocaleDateString('es-AR'):'?'} al ${VENTAS.rangoHasta?new Date(VENTAS.rangoHasta).toLocaleDateString('es-AR'):'?'}</div></div>
    <div class="sp"></div>
    <button class="btn b-gh b-sm" onclick="document.getElementById('fiV2').click()">🔁 Reemplazar ventas</button>
    <input type="file" id="fiV2" accept=".xlsx,.xls" style="display:none" onchange="handleVentasFile(this.files[0])"/>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-v">${fmtMoney(totalImporte)}</div><div class="kpi-l">Facturado en el período</div></div>
    <div class="kpi"><div class="kpi-v">${totalBultos.toLocaleString('es-AR')}</div><div class="kpi-l">Bultos vendidos</div></div>
    <div class="kpi"><div class="kpi-v">${provList.length}</div><div class="kpi-l">Proveedores con venta</div></div>
    ${proy?`<div class="kpi c-nar"><div class="kpi-v">${fmtMoney(totalImporte*proy.factor)}</div><div class="kpi-l">Proyección fin de mes (día ${proy.diasTranscurridos}/${proy.diasDelMes})</div></div>`:''}
    ${varMes!=null?`<div class="kpi ${varMes>=0?'c-gn':'c-rd'}"><div class="kpi-v">${varMes>0?'+':''}${(varMes*100).toFixed(1)}%</div><div class="kpi-l">vs. mes anterior (${escapeHtml(mesAnterior.mesLabel)})</div></div>`:''}
  </div>
  <div class="tbl-grid">
    <div class="chart-card"><h4>📊 Ventas por proveedor</h4><canvas id="chProv" height="220"></canvas></div>
    <div class="chart-card"><h4>⚖ Margen realizado vs objetivo (top proveedores)</h4><canvas id="chMargen" height="220"></canvas></div>
    ${VENTAS_HIST.length>1?`<div class="chart-card full"><h4>📈 Evolución mensual</h4><canvas id="chEvol" height="90"></canvas></div>`:''}
    <div class="chart-card full">
      <h4>🧭 Panel de decisiones</h4>
      <div id="decPanel"></div>
    </div>
    <div class="chart-card full">
      <h4>🏆 Ranking de proveedores</h4>
      <table><thead><tr><th>Proveedor</th><th class="r">Facturado</th><th class="r">%</th><th class="r">Bultos</th><th class="r">Artículos</th><th class="r">Margen realizado</th></tr></thead>
      <tbody>${provList.map(p=>`<tr>
        <td>${escapeHtml(p.prov)}</td><td class="r bold">${fmtMoney(p.importe)}</td><td class="r">${(p.participacion*100).toFixed(1)}%</td>
        <td class="r">${p.bultos.toLocaleString('es-AR')}</td><td class="r">${p.articulos}</td>
        <td class="r">${p.margenReal!=null?fmtPct(p.margenReal):'—'}</td>
      </tr>`).join('')}</tbody></table>
    </div>
    <div class="chart-card full">
      <h4>🔝 Top 10 artículos por facturación</h4>
      <table><thead><tr><th>Cod</th><th>Artículo</th><th>Proveedor</th><th class="r">Facturado</th><th class="r">Bultos</th></tr></thead>
      <tbody>${topArt.map(a=>`<tr><td class="mn">${a.cod}</td><td>${escapeHtml(a.descripcion)}</td><td>${escapeHtml(a.prov)}</td><td class="r">${fmtMoney(a.importe)}</td><td class="r">${a.bultos.toLocaleString('es-AR')}</td></tr>`).join('')}</tbody></table>
    </div>
  </div>`;

  renderDecisionPanel(provList,topArt);
  dibujarCharts(topProv,mesAnterior);
}

function renderDecisionPanel(provList,topArt){
  const el=document.getElementById('decPanel'); if(!el)return;
  const items=[];
  const umbralRojo=CFG.margenRojo/100;
  // proveedores de alto volumen y margen bajo el objetivo/umbral
  provList.filter(p=>p.margenReal!=null).forEach(p=>{
    if(p.participacion>=0.05 && p.margenReal<umbralRojo){
      items.push({tipo:'alerta',txt:`<strong>${escapeHtml(p.prov)}</strong> representa el ${(p.participacion*100).toFixed(1)}% de la facturación pero su margen realizado es de ${fmtPct(p.margenReal)} — por debajo del umbral de ${CFG.margenRojo}%. Prioridad para renegociar costos o ajustar precio.`});
    }
  });
  const buenos = provList.filter(p=>p.margenReal!=null&&p.margenReal>=umbralRojo&&p.participacion>=0.03).sort((a,b)=>b.margenReal-a.margenReal).slice(0,2);
  buenos.forEach(p=>{
    items.push({tipo:'oport',txt:`<strong>${escapeHtml(p.prov)}</strong> combina buen volumen (${(p.participacion*100).toFixed(1)}%) con margen sano (${fmtPct(p.margenReal)}) — candidato a potenciar o pedir mejores condiciones por escala.`});
  });
  // articulos con costo actualizado recientemente y alta venta
  const recientes=HIST.length?HIST[0]:null;
  if(recientes){
    const codsRecientes=new Set(recientes.detalle.map(d=>d.cod));
    const impactados=topArt.filter(a=>codsRecientes.has(a.cod));
    if(impactados.length){
      items.push({tipo:'info',txt:`${impactados.length} de los artículos más vendidos tuvieron cambio de costo en la última actualización (${new Date(recientes.fecha).toLocaleDateString('es-AR')}) — revisar si el precio de venta ya lo refleja: ${impactados.map(a=>escapeHtml(a.descripcion)).slice(0,4).join(', ')}${impactados.length>4?'...':''}`});
    }
  }
  const sinIdent=provList.find(p=>p.prov==='SIN IDENTIFICAR');
  if(sinIdent&&sinIdent.importe>0){
    items.push({tipo:'info',txt:`${fmtMoney(sinIdent.importe)} en ventas corresponden a artículos que no están en el maestro de costos (código sin cruzar) — revisar esos códigos.`});
  }
  if(!items.length){items.push({tipo:'info',txt:'No se detectaron alertas de margen con los datos y umbrales actuales.'});}
  el.innerHTML=items.map(i=>`<div class="dec-item dec-${i.tipo}"><span class="dec-ico">${i.tipo==='alerta'?'⚠':i.tipo==='oport'?'✓':'ℹ'}</span><span>${i.txt}</span></div>`).join('');
}

function dibujarCharts(topProv,mesAnterior){
  chartsTablero.forEach(c=>c.destroy()); chartsTablero=[];
  const cProv=document.getElementById('chProv');
  if(cProv){
    chartsTablero.push(new Chart(cProv,{type:'bar',data:{
      labels:topProv.map(p=>p.prov),
      datasets:[{label:'Facturado',data:topProv.map(p=>p.importe),backgroundColor:'#1e3a6e'}]
    },options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}));
  }
  const cMargen=document.getElementById('chMargen');
  if(cMargen){
    const conMargen=topProv.filter(p=>p.margenReal!=null);
    chartsTablero.push(new Chart(cMargen,{type:'bar',data:{
      labels:conMargen.map(p=>p.prov),
      datasets:[{label:'Margen realizado %',data:conMargen.map(p=>+(p.margenReal*100).toFixed(1)),backgroundColor:conMargen.map(p=>p.margenReal*100<CFG.margenRojo?'#c41a1a':(p.margenReal*100<CFG.margenAmarillo?'#a06200':'#0a7c4e'))}]
    },options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}));
  }
  const cEvol=document.getElementById('chEvol');
  if(cEvol&&VENTAS_HIST.length>1){
    chartsTablero.push(new Chart(cEvol,{type:'line',data:{
      labels:VENTAS_HIST.map(h=>h.mesLabel),
      datasets:[{label:'Facturado',data:VENTAS_HIST.map(h=>h.totalImporte),borderColor:'#F26522',backgroundColor:'#fff1ea',fill:true,tension:.25}]
    },options:{plugins:{legend:{display:false}}}}));
  }
}
