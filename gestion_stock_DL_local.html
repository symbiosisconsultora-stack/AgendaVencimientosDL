<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Gestión de Stock DL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: banda navy con logo y período → barra de pestañas → contenido en tarjetas sobrias; tablas densas con números tabulares */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#EEF1F6; --ink:#16213A; --ink2:#4A5670; --muted:#8A93A8; --line:#DCE1EA;
  --band:#152A55; --band-ink:#FFFFFF; --band-ink2:#B9C5DE;
  --navy:#2A4E96; --orange:#F26522; --orange-ink:#C24A10; --orange-soft:#FDE9DE;
  --good:#1D8A57; --good-soft:#DFF3E9; --warn:#A86F00; --warn-soft:#FBF0D6; --crit:#C2322B; --crit-soft:#FBE3E1;
  --font:"Archivo",Arial,Helvetica,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#151D31; --surface2:#1B2540; --ink:#E7EBF3; --ink2:#AAB4C8; --muted:#6F7A93; --line:#28324B;
  --band:#0F1B38; --band-ink:#FFFFFF; --band-ink2:#9DAACA;
  --navy:#7D9CE0; --orange:#F7864C; --orange-ink:#F7955F; --orange-soft:#3A2418;
  --good:#45C08A; --good-soft:#15301F; --warn:#E3AE3D; --warn-soft:#33280F; --crit:#EF6A60; --crit-soft:#3A1A19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#151D31; --surface2:#1B2540; --ink:#E7EBF3; --ink2:#AAB4C8; --muted:#6F7A93; --line:#28324B;
  --band:#0F1B38; --band-ink:#FFFFFF; --band-ink2:#9DAACA;
  --navy:#7D9CE0; --orange:#F7864C; --orange-ink:#F7955F; --orange-soft:#3A2418;
  --good:#45C08A; --good-soft:#15301F; --warn:#E3AE3D; --warn-soft:#33280F; --crit:#EF6A60; --crit-soft:#3A1A19; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right}

/* banda */
header.band{background:var(--band);color:var(--band-ink)}
header.band .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
.brand h1{font-size:19px;font-weight:800;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand small{display:block;color:var(--band-ink2);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.period{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--band-ink2)}
.period b{color:var(--band-ink);font-weight:600}
.period input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:4px 8px;color:var(--band-ink);color-scheme:dark}
.arrow{color:var(--orange)}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:none;border:0;padding:12px 14px;cursor:pointer;color:var(--ink2);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--orange)}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}

/* bloques */
.sec-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.sec-h h2{font-size:18px;margin:0;font-weight:800;text-wrap:balance}
.sec-h p{margin:2px 0 0;color:var(--ink2);font-size:13px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:700}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v small{font-size:14px;font-weight:600;color:var(--ink2)}
.kpi .s{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.kpi.hl{border-top:3px solid var(--orange)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar select,.inp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.toolbar input[type=search]{flex:1 1 220px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dng{color:var(--crit);border-color:var(--crit)}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.small{font-size:12.5px}

/* tablas */
.tbl-wrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl-wrap.short{max-height:420px}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{position:sticky;top:0;background:var(--surface2);color:var(--ink2);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
thead th.ns{cursor:default}
thead th .ar{color:var(--orange)}
tbody td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
tbody tr.sel td{background:var(--orange-soft)}
td.desc{white-space:normal;min-width:220px;max-width:380px}
td.code{font-family:var(--mono);font-size:12px;color:var(--ink2)}
tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:700;padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
td.neg{color:var(--crit);font-weight:700}
td.pos{color:var(--good)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--good-soft);color:var(--good)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-crit{background:var(--crit-soft);color:var(--crit)}
.c-mut{background:var(--surface2);color:var(--ink2)}
.c-a{background:var(--orange-soft);color:var(--orange-ink)}
.inf{font-style:italic;color:var(--ink2)}
.chart-box{position:relative;height:280px}
.chart-box.tall{height:340px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* alertas */
.alerts{display:flex;flex-direction:column;gap:0}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .t{font-weight:600}
.alert .d{font-size:12.5px;color:var(--ink2)}
.alert .n{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}

/* import */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--orange)}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px 22px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:center}
.empty h2{margin:0 0 8px;font-size:22px;font-weight:800;text-wrap:balance}
.empty ol{margin:8px 0 0;padding-left:20px;color:var(--ink2)}
.empty li{margin:4px 0}
.log{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:pre-wrap;margin:0}
.note{font-size:12.5px;color:var(--ink2);background:var(--surface2);border-radius:6px;padding:8px 12px}

/* login */
#login{position:fixed;inset:0;background:var(--band);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#login[hidden]{display:none}
#login form{background:var(--surface);border-radius:12px;padding:28px;width:min(360px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
#login img{width:84px;height:84px;object-fit:contain}
#login h2{margin:0;font-size:20px}
#login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
#login .err{color:var(--crit);font-size:13px;min-height:1em}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,30,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0}
.row-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:640px){.kpi .v{font-size:22px}.period{margin-left:0}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ============ ESTADO Y PERSISTENCIA ============ */
const LS_KEY='dl_stock_v1', CFG_KEY='dl_stock_cfg_v1';
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let DB=ls.get(LS_KEY)||{articles:{},snaps:[],movs:[],files:[],costs:{}};
let CFG=Object.assign({pw:'lucas2026',cob:7,baseDate:null,hasta:null},ls.get(CFG_KEY)||{});
function save(){const ok=ls.set(LS_KEY,DB);ls.set(CFG_KEY,CFG);if(!ok)toast('No se pudo guardar en el navegador (almacenamiento lleno o bloqueado). Los datos quedan sólo en esta sesión.')}
const UI={tab:'tablero',ficha:null,movTipo:'',movDoc:null,stockQ:'',stockProv:'',stockAlm:'',stockEst:'',concSnap:null,concOnly:true};

const TIPOS={
  REM:{l:'Remito ingreso (compra)',s:1},DES:{l:'Planilla de descarga',s:1},SOB:{l:'Sobrante de mercadería',s:1},RCS:{l:'Recepción de depósito',s:1},
  CAR:{l:'Planilla de carga',s:-1},DEV:{l:'Devolución a proveedor',s:-1},FAL:{l:'Faltante de mercadería',s:-1},ENS:{l:'Envío a depósito',s:-1}};
const TORD=['REM','DES','SOB','RCS','CAR','DEV','FAL','ENS'];
const sign=t=>TIPOS[t]?TIPOS[t].s:0;

/* ============ FORMATO ============ */
const NF0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}),NF1=new Intl.NumberFormat('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}),NF2=new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fB=n=>n==null||isNaN(n)?'–':NF0.format(Math.round(n)===0?0:n);
const fK=n=>!n||Math.abs(n)<0.005?'–':NF2.format(n);
const fM=n=>n==null||isNaN(n)?'–':'$ '+NF0.format(n);
const fP=n=>isFinite(n)?NF1.format(n*100)+' %':'–';
const fD=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const fDs=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ /g,' ').trim().toLowerCase();
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function toast(msg){const m=$('#modal');m.innerHTML=`<div class="modal-bg"><div class="modal"><div>${msg}</div><div class="row-actions"><button class="btn pri" id="mOk">Aceptar</button></div></div></div>`;$('#mOk').onclick=()=>m.innerHTML=''}
function confirmBox(msg,fn){const m=$('#modal');m.innerHTML=`<div class="modal-bg"><div class="modal"><h3>Confirmar</h3><div>${msg}</div><div class="row-actions"><button class="btn" id="mNo">Cancelar</button><button class="btn dng" id="mYes">Confirmar</button></div></div></div>`;$('#mNo').onclick=()=>m.innerHTML='';$('#mYes').onclick=()=>{m.innerHTML='';fn()}}

/* ============ LECTURA DE EXCEL (Chess) ============ */
// Chess exporta decimales con punto. Excel en es-AR toma el punto como separador de miles cuando hay 3+ decimales
// y guarda el número multiplicado (ej. "1711.402" → 1711402 con formato #,##0). Esas celdas se detectan por formato.
const mangled=c=>c&&c.t==='n'&&c.z&&/#,##0/.test(c.z)&&!/0\.0/.test(c.z);
function num(c,fix){

  if(typeof v==='string'){let t=v.trim();if(!t)return 0;if(/,/.test(t)&&/\./.test(t))t=t.replace(/\./g,'').replace(',','.');else if(/,/.test(t))t=t.replace(',','.');const n=parseFloat(t);return isNaN(n)?0:n}

}
function blankCell(c){return !c||c.v==null||(typeof c.v==='string'&&!c.v.trim())}

  if(!c||c.v==null)return null;
  if(typeof c.v==='number'){const d=XLSX.SSF.parse_date_code(c.v);if(!d)return null;return `${d.y}-${pad(d.m)}-${pad(d.d)}`}
  if(c.v instanceof Date){const d=new Date(c.v.getTime()+12*3600e3);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}

function findHeader(rows,need){

function dateFromName(name){

async function importFiles(files){
  const log=[];
  for(const f of files){
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellNF:true,cellDates:false});
      let done=false;
      for(const sn of wb.SheetNames){
        const rows=matrix(wb.Sheets[sn]);
        let hr=findHeader(rows,['tipo','articulo','bultos']);
        if(hr>=0&&rows[hr].some(c=>norm(c&&c.v)==='fecha stock'||norm(c&&c.v)==='fecha mvto')){log.push(parseMov(rows,hr,f.name));done=true;break}
        hr=findHeader(rows,['almacen','articulo','bultos']);
        if(hr>=0){log.push(parseStock(rows,hr,f.name));done=true;break}
      }
      if(!done)log.push(`✕ ${f.name}: no se reconocen las columnas. Se espera el listado de movimientos (Tipo, Artículo, Bultos, Fecha Stock) o el listado de stock (Almacén, Artículo, Bultos).`);
    }catch(e){log.push(`✕ ${f.name}: no se pudo leer (${e.message}).`)}
  }
  inferProviders();save();
  UI.lastLog=log.join('\n');
  if(UI.tab!=='datos'&&DB.snaps.length&&DB.movs.length)UI.tab='tablero';
  renderAll();
}
function parseMov(rows,hr,fname){
  const H=rows[hr].map(c=>norm(c&&c.v)),ix=n=>H.indexOf(n);
  const C={dep:ix('deposito'),tipo:ix('tipo'),serie:ix('serie'),num:ix('numero'),anu:ix('anulado'),fm:ix('fecha mvto'),fs:ix('fecha stock'),pdesc:ix('descripcion proveedor'),dd:ix('deposito destino'),ddesc:ix('descripcion'),tr:ix('descripcion transporte'),art:ix('articulo'),adesc:ix('descripcion articulo'),b:ix('bultos'),k:ix('peso'),c:ix('costo neto'),st:ix('subtotal')};
  const out=[];let skipped=0,fixed=0;const unk=new Set();
  for(let r=hr+1;r<rows.length;r++){
    const R=rows[r],g=i=>i>=0?R[i]:null;
    const a=Math.round(num(g(C.art)));if(!a)continue;
    const anu=norm(g(C.anu)&&g(C.anu).v);if(anu==='yes'||anu==='si'||anu==='s'){skipped++;continue}
    const t=String(g(C.tipo)&&g(C.tipo).v||'').trim().toUpperCase();if(!TIPOS[t])unk.add(t);
    const f=dateOf(g(C.fs))||dateOf(g(C.fm));if(!f)continue;
    const b=num(g(C.b)),k=num(g(C.k),true),c=num(g(C.c),true);
    let st=num(g(C.st),false);
    if(mangled(g(C.c))||mangled(g(C.k))||mangled(g(C.st)))fixed++;
    if(mangled(g(C.st))||(!st&&c))st=c*(k>0?k:b);
    const pd=g(C.pdesc)&&g(C.pdesc).v?String(g(C.pdesc).v).trim():'';
    const tr=g(C.tr)&&g(C.tr).v?String(g(C.tr).v).trim():'';
    const dd=Math.round(num(g(C.dd))),ddesc=g(C.ddesc)&&g(C.ddesc).v?String(g(C.ddesc).v).trim():'';
    const ad=g(C.adesc)&&g(C.adesc).v?String(g(C.adesc).v).trim():'';
    if(!DB.articles[a])DB.articles[a]={d:ad};else if(!DB.articles[a].d&&ad)DB.articles[a].d=ad;
    out.push({d:Math.round(num(g(C.dep)))||1,t,s:Math.round(num(g(C.serie))),n:Math.round(num(g(C.num))),f,fm:dateOf(g(C.fm))||f,pd,tr,dd,ddesc,a,b,k,c,st});
  }
  // reemplaza comprobantes ya cargados con la misma clave
  const keys=new Set(out.map(m=>`${m.d}|${m.t}|${m.s}|${m.n}`));
  const before=DB.movs.length;
  DB.movs=DB.movs.filter(m=>!keys.has(`${m.d}|${m.t}|${m.s}|${m.n}`));
  const replaced=before-DB.movs.length;
  DB.movs.push(...out);
  DB.movs.sort((x,y)=>x.f<y.f?-1:x.f>y.f?1:x.n-y.n);
  // costos: último remito por artículo (devolución sólo si no hay remito)
  for(const m of out){
    if((m.t!=='REM'&&m.t!=='DEV')||!m.c)continue;
    let base='bulto';if(m.k>0&&Math.abs(m.c*m.k-m.st)<=Math.abs(m.c*m.b-m.st))base='kg';
    const cur=DB.costs[m.a];
    if(m.t==='DEV'&&cur&&cur.src==='REM')continue;
    if(!cur||m.f>=cur.f||(m.t==='REM'&&cur.src==='DEV'))DB.costs[m.a]={c:m.c,base,f:m.f,p:m.pd,src:m.t};
  }
  const fs=out.map(m=>m.f).sort();
  DB.files.push({name:fname,kind:'mov',rows:out.length,from:fs[0],to:fs[fs.length-1],at:new Date().toISOString().slice(0,10)});
  let msg=`✓ ${fname}: ${NF0.format(out.length)} movimientos del ${fD(fs[0])} al ${fD(fs[fs.length-1])}.`;
  if(replaced)msg+=` Se reemplazaron ${NF0.format(replaced)} líneas de comprobantes ya cargados.`;
  if(fixed)msg+=` Se corrigieron ${fixed} importes/pesos con decimales mal exportados.`;
  if(skipped)msg+=` ${skipped} líneas anuladas omitidas.`;
  if(unk.size)msg+=` Tipos no reconocidos (no afectan el stock): ${[...unk].join(', ')}.`;
  return msg;
}
function parseStock(rows,hr,fname){
  const H=rows[hr].map(c=>norm(c&&c.v));
  const all=n=>H.map((h,i)=>h===n?i:-1).filter(i=>i>=0);
  const ia=H.indexOf('articulo'),id=H.indexOf('descripcion'),ial=H.indexOf('almacen'),io=H.indexOf('orden');
  const B=all('bultos'),K=all('peso');
  const out={};let n=0,rec=0;
  for(let r=hr+1;r<rows.length;r++){
    const R=rows[r];const a=Math.round(num(R[ia]));if(!a)continue;
    const d=R[id]&&R[id].v?String(R[id].v).trim():'';
    const b=num(R[B[0]]),k=K.length?num(R[K[0]],true):0;
    let rb=null,rk=null;
    if(B[1]!=null&&!blankCell(R[B[1]])){rb=num(R[B[1]]);rec++}
    if(K[1]!=null&&!blankCell(R[K[1]])){rk=num(R[K[1]],true);if(rb==null)rb=0}
    out[a]=[b,k,rb,rk];n++;
    DB.articles[a]=Object.assign(DB.articles[a]||{},{d:d||(DB.articles[a]||{}).d||'',alm:Math.round(num(R[ial])),ord:Math.round(num(R[io]))});
  }
  let date=dateFromName(fname)||new Date().toISOString().slice(0,10);
  DB.snaps=DB.snaps.filter(s=>s.date!==date);
  DB.snaps.push({date,file:fname,rows:out,rec});
  DB.snaps.sort((x,y)=>x.date<y.date?-1:1);
  DB.files.push({name:fname,kind:'stock',rows:n,from:date,to:date,at:new Date().toISOString().slice(0,10)});
  return `✓ ${fname}: stock de ${NF0.format(n)} artículos al ${fD(date)}${dateFromName(fname)?' (fecha tomada del nombre del archivo)':' (fecha no encontrada en el nombre: revisala en la lista de abajo)'}.${rec?` Incluye recuento físico en ${rec} artículos.`:''}`;
}
function inferProviders(){
  const A=DB.articles;
  for(const a in A){A[a].prov=null;A[a].provInf=false}
  for(const m of DB.movs){if((m.t==='REM'||m.t==='DEV')&&m.pd&&A[m.a])A[m.a].prov=m.pd}
  const brand=d=>{const w=String(d||'').toUpperCase().replace(/[^A-ZÑ0-9 ]/g,' ').trim().split(/\s+/);return w.length?w[w.length-1]:''};
  const map={};
  for(const a in A){if(A[a].prov){const b=brand(A[a].d);if(!b||/^\d/.test(b))continue;(map[b]=map[b]||{})[A[a].prov]=(map[b][A[a].prov]||0)+1}}
  for(const a in A){if(A[a].prov)continue;const m=map[brand(A[a].d)];if(!m)continue;const best=Object.entries(m).sort((x,y)=>y[1]-x[1])[0];A[a].prov=best[0];A[a].provInf=true}
}

/* ============ CÁLCULO ============ */
function baseSnap(){if(!DB.snaps.length)return null;return DB.snaps.find(s=>s.date===CFG.baseDate)||DB.snaps[0]}
function movRange(){let mn=null,mx=null;const b=baseSnap();for(const m of DB.movs){if(b&&m.f<=b.date)continue;if(!mn||m.f<mn)mn=m.f;if(!mx||m.f>mx)mx=m.f}return{mn,mx}}
function hasta(){const r=movRange();if(CFG.hasta&&r.mx&&CFG.hasta<=r.mx&&(!r.mn||CFG.hasta>=baseSnap().date))return CFG.hasta;return r.mx}
let CALC=null;
function calc(D1){
  const base=baseSnap();if(!base)return null;
  const D0=base.date;D1=D1||hasta()||D0;
  const A={};
  const get=a=>A[a]||(A[a]={a:+a,ini:0,iniK:0,b:{},k:{},v:{},fin:0,finK:0,d2b:0,d2k:0,lastOut:null});
  for(const a in base.rows){const o=get(a);o.ini=base.rows[a][0];o.iniK=base.rows[a][1]}
  const daily={},opDays=new Set(),movs=[];
  for(const m of DB.movs){
    if(m.f<=D0||m.f>D1)continue;
    movs.push(m);
    if(m.d===1){
      const o=get(m.a);o.b[m.t]=(o.b[m.t]||0)+m.b;o.k[m.t]=(o.k[m.t]||0)+m.k;
      const dy=daily[m.f]||(daily[m.f]={in:0,out:0});const s=sign(m.t);if(s>0)dy.in+=m.b;else if(s<0)dy.out+=m.b;
      if(m.t==='CAR'){opDays.add(m.f);if(!o.lastOut||m.f>o.lastOut)o.lastOut=m.f}
    }else if(m.d===2&&m.t==='RCS'){const o=get(m.a);o.d2b+=m.b;o.d2k+=m.k}
  }
  const nDays=opDays.size||1;
  const list=[];
  for(const a in A){
    const o=A[a],art=DB.articles[a]||{};
    o.d=art.d||'(sin descripción)';o.alm=art.alm;o.prov=art.prov||'';o.provInf=!!art.provInf;
    let fb=o.ini,fk=o.iniK;for(const t in o.b){fb+=sign(t)*o.b[t];fk+=sign(t)*o.k[t]}
    o.fin=Math.round(fb*1000)/1000;o.finK=Math.round(fk*1000)/1000;
    const g=(t,x='b')=>o[x][t]||0;
    o.ingresos=g('REM')+g('DES')+g('SOB');o.egresos=g('CAR')+g('DEV')+g('FAL')+g('ENS');
    o.venta=g('CAR')-g('DES');o.ventaK=g('CAR','k')-g('DES','k');
    o.prom=o.venta/nDays;o.cob=o.prom>0?o.fin/o.prom:null;
    o.pes=(o.iniK>0||Object.values(o.k).some(v=>v>0));
    const c=DB.costs[a];o.cost=c||null;
    const val=(b,k)=>c?(c.base==='kg'?k*c.c:b*c.c):null;
    o.valFin=val(Math.max(o.fin,0),Math.max(o.finK,0));o.valIni=val(o.ini,o.iniK);
    for(const t of TORD)o.v[t]=val(g(t),g(t,'k'));
    o.valD2=val(o.d2b,o.d2k);
    const moved=o.ingresos||o.egresos;
    if(o.fin<0||o.finK<-0.01)o.est='neg';
    else if(o.fin<=0&&o.finK<=0.01&&g('CAR')>0)o.est='quiebre';
    else if(o.cob!=null&&o.cob<CFG.cob)o.est='cob';
    else if((o.fin>0||o.finK>0.01)&&!g('CAR'))o.est='inmov';
    else if(!moved&&o.fin<=0&&o.finK<=0.01)o.est='inact';

const EST={neg:['Stock negativo','c-crit'],quiebre:['Quiebre','c-crit'],cob:['Cobertura baja','c-warn'],inmov:['Sin salidas','c-mut'],inact:['Sin stock ni mov.','c-mut'],ok:['Normal','c-ok']};
const chip=e=>`<span class="chip ${EST[e][1]}">${EST[e][0]}</span>`;
const provCell=o=>o.prov?(o.provInf?`<span class="inf" title="Proveedor deducido por la marca de la descripción">${esc(o.prov)}</span>`:esc(o.prov)):'<span class="muted">Sin asignar</span>';
const sum=(arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);

const TBL={};
function table(id,cols,rows,opt={}){
  const st=TBL[id]||(TBL[id]={k:opt.sort||null,dir:opt.dir||-1});
  if(st.k){const c=cols.find(c=>c.k===st.k);const val=c&&c.sv?c.sv:(r=>r[st.k]);rows=rows.slice().sort((a,b)=>{let x=val(a),y=val(b);if(x==null)x=-Infinity;if(y==null)y=-Infinity;if(typeof x==='string'||typeof y==='string')return String(x).localeCompare(String(y))*st.dir;return(x-y)*st.dir})}
  const th=cols.map(c=>`<th class="${c.n?'n':''} ${c.ns?'ns':''}" data-k="${c.k}">${c.l}${st.k===c.k?` <span class="ar">${st.dir>0?'▲':'▼'}</span>`:''}</th>`).join('');
  const lim=opt.limit||2000;
  const body=rows.slice(0,lim).map((r,i)=>`<tr class="${opt.click?'click':''} ${opt.sel&&opt.sel(r)?'sel':''}" data-i="${i}">${cols.map(c=>{const v=c.f?c.f(r):esc(r[c.k]);const cl=[c.n?'n':'',c.cls?(typeof c.cls==='function'?c.cls(r):c.cls):''].join(' ');return`<td class="${cl}">${v}</td>`}).join('')}</tr>`).join('');
  const foot=opt.foot?`<tfoot><tr>${cols.map(c=>`<td class="${c.n?'n':''}">${opt.foot[c.k]??''}</td>`).join('')}</tr></tfoot>`:'';
  const html=`<div class="tbl-wrap ${opt.short?'short':''}" id="tw-${id}"><table><thead><tr>${th}</tr></thead><tbody>${body||`<tr><td colspan="${cols.length}" class="muted" style="padding:16px">${opt.empty||'Sin datos para mostrar.'}</td></tr>`}</tbody>${foot}</table></div>${rows.length>lim?`<div class="small muted">Mostrando ${lim} de ${rows.length} filas.</div>`:''}`;
  setTimeout(()=>{const w=document.getElementById('tw-'+id);if(!w)return;
    w.querySelectorAll('th').forEach(h=>{if(h.classList.contains('ns'))return;h.onclick=()=>{const k=h.dataset.k;if(st.k===k)st.dir*=-1;else{st.k=k;st.dir=cols.find(c=>c.k===k).n?-1:1}renderView()}});
    if(opt.click)w.querySelectorAll('tbody tr[data-i]').forEach(tr=>tr.onclick=()=>opt.click(rows[+tr.dataset.i]));

  return html;
}
function exportXlsx(id,name){
  const t=TBL[id];if(!t)return;

  const data=t.rows.map(r=>{const o={};t.cols.forEach(c=>{let v=c.x?c.x(r):(c.f?strip(c.f(r)):r[c.k]);o[strip(c.l)]=v});return o});
  const ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Datos');

function vTablero(){
  const C=CALC,L=C.list,T=t=>sum(L,o=>o.b[t]),TK=t=>sum(L,o=>o.k[t]),TV=t=>sum(L,o=>o.v[t]);
  const ini=sum(L,o=>o.ini),iniK=sum(L,o=>o.iniK),fin=sum(L,o=>Math.max(o.fin,0)),finK=sum(L,o=>Math.max(o.finK,0));
  const valFin=sum(L,o=>o.valFin),withStock=L.filter(o=>o.fin>0||o.finK>0.01),costed=withStock.filter(o=>o.cost);
  const car=T('CAR'),des=T('DES');
  const remDocs=new Set(C.movs.filter(m=>m.t==='REM').map(m=>m.n)).size;
  const remVal=sum(C.movs.filter(m=>m.t==='REM'),m=>m.st);
  const ajB=T('SOB')-T('FAL'),ajV=TV('SOB')-TV('FAL');
  const cnt=e=>L.filter(o=>o.est===e).length;
  const inmovVal=sum(L.filter(o=>o.est==='inmov'),o=>o.valFin);
  const days=(new Date(C.D1)-new Date(C.D0))/864e5;
  const alerts=[
    ['neg','Artículos con stock teórico negativo','Indican salidas sin ingreso registrado o un error en el stock base. Revisar en la ficha.',cnt('neg')],
    ['quiebre','Artículos en quiebre','Sin stock al cierre pero con cargas en el período.',cnt('quiebre')],
    ['cob',`Cobertura menor a ${CFG.cob} días`,'Al ritmo de salida neta actual, el stock no alcanza.',cnt('cob')],
    ['inmov','Artículos con stock y sin salidas',`Stock inmovilizado valorizado: ${fM(inmovVal)}.`,cnt('inmov')]];
  const top=L.filter(o=>o.venta>0).sort((a,b)=>b.venta-a.venta).slice(0,10);
  const html=`
  <div class="sec-h"><div><h2>Tablero del período</h2><p>Del ${fD(C.D0)} (stock base) al ${fD(C.D1)} · ${Math.round(days)} días corridos, ${C.nDays} días con cargas a reparto. Cifras del Depósito Casa Central.</p></div></div>
  <div class="kpis">
    <div class="kpi"><span class="l">Stock inicial</span><span class="v">${fB(ini)} <small>bultos</small></span><span class="s">${fK(iniK)} kg en pesables · ${L.filter(o=>o.ini>0||o.iniK>0).length} artículos con stock</span></div>
    <div class="kpi"><span class="l">Compras recibidas</span><span class="v">${fB(T('REM'))} <small>bultos</small></span><span class="s">${remDocs} remitos · ${fM(remVal)}</span></div>
    <div class="kpi"><span class="l">Salida neta a reparto</span><span class="v">${fB(car-des)} <small>bultos</small></span><span class="s">Cargado ${fB(car)} · descargado ${fB(des)} (${fP(des/car)} de retorno)</span></div>
    <div class="kpi hl"><span class="l">Stock teórico al ${fDs(C.D1)}</span><span class="v">${fB(fin)} <small>bultos</small></span><span class="s">${fK(finK)} kg · ${withStock.length} artículos con stock</span></div>
    <div class="kpi"><span class="l">Valor estimado del stock</span><span class="v">${fM(valFin)}</span><span class="s">Costo de último remito · ${costed.length} de ${withStock.length} artículos con costo</span></div>
    <div class="kpi"><span class="l">Ajustes de inventario</span><span class="v">${ajB>0?'+':''}${fB(ajB)} <small>bultos</small></span><span class="s">Sobrantes ${fB(T('SOB'))} · faltantes ${fB(T('FAL'))} · neto ${fM(ajV)}</span></div>
    <div class="kpi"><span class="l">Enviado a vencidos/roturas</span><span class="v">${fB(T('ENS'))} <small>bultos</small></span><span class="s">${fK(TK('ENS'))} kg · ${fM(TV('ENS'))}</span></div>
    <div class="kpi"><span class="l">Devoluciones a proveedor</span><span class="v">${fB(T('DEV'))} <small>bultos</small></span><span class="s">${fM(sum(C.movs.filter(m=>m.t==='DEV'),m=>m.st))}</span></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Ingresos y egresos por día (bultos)</h3>
      <div class="legend"><span><i style="background:var(--navy)"></i>Ingresos (compras, descargas, sobrantes)</span><span><i style="background:var(--orange)"></i>Egresos (cargas, devoluciones, faltantes, envíos)</span></div>
      <div class="chart-box"><canvas id="chDaily"></canvas></div></div>
    <div class="card"><h3>Stock teórico total al cierre de cada día (bultos)</h3>
      <div class="legend"><span>Incluye el stock base del ${fD(C.D0)}</span></div>
      <div class="chart-box"><canvas id="chStock"></canvas></div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Alertas</h3><div class="alerts">${alerts.map(a=>`<div class="alert">${chip(a[0])}<div><div class="t">${a[1]}</div><div class="d">${a[2]}</div></div><div class="n">${a[3]}</div></div>`).join('')}</div>
      <div style="margin-top:10px"><button class="btn" id="goAlerts">Ver artículos con alerta</button></div></div>
    <div class="card"><h3>Top 10 por salida neta (cargas − descargas)</h3>
      ${table('top',[{k:'a',l:'Art.',cls:'code'},{k:'d',l:'Descripción',cls:'desc'},{k:'venta',l:'Bultos',n:1,f:o=>fB(o.venta)},{k:'fin',l:'Stock final',n:1,f:o=>fB(o.fin)},{k:'cob',l:'Cobertura',n:1,f:o=>o.cob==null?'–':NF1.format(o.cob)+' d'}],top,{sort:'venta',click:o=>{UI.ficha=o.a;UI.tab='ficha';renderAll()},short:1})}</div>
  </div>
  <div class="card"><h3>Resumen por tipo de movimiento</h3>${table('tipos',[{k:'t',l:'Código',cls:'code'},{k:'l',l:'Movimiento'},{k:'s',l:'Efecto',f:r=>r.s>0?'<span class="chip c-ok">Suma</span>':'<span class="chip c-a">Resta</span>'},{k:'docs',l:'Comprobantes',n:1,f:r=>fB(r.docs)},{k:'b',l:'Bultos',n:1,f:r=>fB(r.b)},{k:'k',l:'Kg',n:1,f:r=>fK(r.k)},{k:'v',l:'Valor estimado',n:1,f:r=>fM(r.v)}],
    TORD.filter(t=>t!=='RCS').map(t=>({t,l:TIPOS[t].l,s:TIPOS[t].s,docs:new Set(C.movs.filter(m=>m.t===t&&m.d===1).map(m=>m.n)).size,b:T(t),k:TK(t),v:t==='REM'||t==='DEV'?sum(C.movs.filter(m=>m.t===t),m=>m.st):TV(t)})),{short:1})}
    <p class="small muted" style="margin:8px 0 0">Compras y devoluciones se valorizan con el importe del comprobante. El resto de los movimientos se valoriza con el costo del último remito de cada artículo; los artículos sin remito cargado quedan sin valor.</p></div>`;
  return html;
}
vTablero.after=()=>{
  const C=CALC;$('#goAlerts').onclick=()=>{UI.tab='stock';UI.stockEst='alert';renderAll()};
  const navy=css('--navy'),org=css('--orange');
  chart('chDaily',{type:'bar',data:{labels:C.days.map(fDs),datasets:[{label:'Ingresos',data:C.days.map(d=>C.daily[d].in),backgroundColor:navy,borderRadius:4,maxBarThickness:22},{label:'Egresos',data:C.days.map(d=>C.daily[d].out),backgroundColor:org,borderRadius:4,maxBarThickness:22}]},
    options:{scales:{x:{grid:{display:false}},y:{ticks:{callback:v=>NF0.format(v)}}}},tip:{label:c=>`${c.dataset.label}: ${NF0.format(c.raw)} bultos`}});
  chart('chStock',{type:'line',data:{labels:C.series.map(s=>fDs(s.f)),datasets:[{label:'Stock',data:C.series.map(s=>s.v),borderColor:navy,backgroundColor:navy+'22',fill:true,tension:0,borderWidth:2,pointRadius:C.series.map((s,i)=>i===C.series.length-1?5:0),pointBackgroundColor:org}]},
    options:{scales:{x:{grid:{display:false}},y:{ticks:{callback:v=>NF0.format(v)}}}},tip:{label:c=>`Stock: ${NF0.format(c.raw)} bultos`}});
};

/* ---- STOCK ---- */
function stockRows(){
  const q=norm(UI.stockQ);
  return CALC.list.filter(o=>{
    if(q&&!(String(o.a).includes(q)||norm(o.d).includes(q)))return false;
    if(UI.stockProv&&(UI.stockProv==='__'?o.prov:o.prov!==UI.stockProv))return false;
    if(UI.stockAlm!==''&&String(o.alm)!==UI.stockAlm)return false;
    if(UI.stockEst==='alert'){if(!['neg','quiebre','cob'].includes(o.est))return false}
    else if(UI.stockEst==='activos'){if(o.est==='inact')return false}
    else if(UI.stockEst&&o.est!==UI.stockEst)return false;
    return true;});
}
function vStock(){
  if(UI.stockEst===undefined)UI.stockEst='';
  const provs=[...new Set(CALC.list.map(o=>o.prov).filter(Boolean))].sort();
  const alms=[...new Set(CALC.list.map(o=>o.alm).filter(v=>v!=null))].sort((a,b)=>a-b);
  const rows=stockRows();
  const g=(o,t)=>o.b[t]||0;
  const cols=[{k:'a',l:'Art.',cls:'code'},{k:'d',l:'Descripción',cls:'desc'},{k:'prov',l:'Proveedor',f:provCell},{k:'alm',l:'Alm.',n:1},
    {k:'ini',l:'Inicial',n:1,f:o=>fB(o.ini)},{k:'rem',l:'Compras',n:1,sv:o=>g(o,'REM'),f:o=>fB(g(o,'REM')),x:o=>g(o,'REM')},{k:'des',l:'Descargas',n:1,sv:o=>g(o,'DES'),f:o=>fB(g(o,'DES')),x:o=>g(o,'DES')},{k:'sob',l:'Sobr.',n:1,sv:o=>g(o,'SOB'),f:o=>fB(g(o,'SOB')),x:o=>g(o,'SOB')},
    {k:'car',l:'Cargas',n:1,sv:o=>g(o,'CAR'),f:o=>fB(g(o,'CAR')),x:o=>g(o,'CAR')},{k:'dev',l:'Dev. prov.',n:1,sv:o=>g(o,'DEV'),f:o=>fB(g(o,'DEV')),x:o=>g(o,'DEV')},{k:'fal',l:'Falt.',n:1,sv:o=>g(o,'FAL'),f:o=>fB(g(o,'FAL')),x:o=>g(o,'FAL')},{k:'ens',l:'A vencidos',n:1,sv:o=>g(o,'ENS'),f:o=>fB(g(o,'ENS')),x:o=>g(o,'ENS')},
    {k:'fin',l:'Final',n:1,f:o=>`<b>${fB(o.fin)}</b>`,x:o=>o.fin,cls:o=>o.fin<0?'neg':''},{k:'finK',l:'Kg final',n:1,f:o=>fK(o.finK),x:o=>o.finK,cls:o=>o.finK<-0.01?'neg':''},
    {k:'venta',l:'Salida neta',n:1,f:o=>fB(o.venta)},{k:'prom',l:'Prom./día',n:1,f:o=>o.prom?NF1.format(o.prom):'–',x:o=>+o.prom.toFixed(2)},{k:'cob',l:'Cobertura',n:1,f:o=>o.cob==null?'–':NF1.format(o.cob)+' d',x:o=>o.cob==null?'':+o.cob.toFixed(1)},
    {k:'cu',l:'Costo unit.',n:1,sv:o=>o.cost?o.cost.c:null,f:o=>o.cost?fM(o.cost.c)+(o.cost.base==='kg'?'/kg':''):'–',x:o=>o.cost?o.cost.c:''},{k:'valFin',l:'Valor final',n:1,f:o=>fM(o.valFin),x:o=>o.valFin??''},{k:'est',l:'Estado',f:o=>chip(o.est),x:o=>EST[o.est][0]}];
  const foot={d:`${rows.length} artículos`,ini:fB(sum(rows,o=>o.ini)),rem:fB(sum(rows,o=>g(o,'REM'))),des:fB(sum(rows,o=>g(o,'DES'))),sob:fB(sum(rows,o=>g(o,'SOB'))),car:fB(sum(rows,o=>g(o,'CAR'))),dev:fB(sum(rows,o=>g(o,'DEV'))),fal:fB(sum(rows,o=>g(o,'FAL'))),ens:fB(sum(rows,o=>g(o,'ENS'))),fin:fB(sum(rows,o=>o.fin)),finK:fK(sum(rows,o=>o.finK)),venta:fB(sum(rows,o=>o.venta)),valFin:fM(sum(rows,o=>o.valFin))};
  return`<div class="sec-h"><div><h2>Stock por artículo</h2><p>Stock teórico = inicial + compras + descargas + sobrantes − cargas − devoluciones − faltantes − envíos a vencidos. Cobertura = stock final ÷ salida neta promedio por día con cargas. Hacé clic en un artículo para ver su ficha.</p></div><button class="btn" id="expStock">Exportar a Excel</button></div>
  <div class="toolbar">
    <input type="search" id="sQ" placeholder="Buscar por código o descripción" value="${esc(UI.stockQ)}">
    <select id="sProv" aria-label="Proveedor"><option value="">Todos los proveedores</option>${provs.map(p=>`<option ${UI.stockProv===p?'selected':''}>${esc(p)}</option>`).join('')}<option value="__" ${UI.stockProv==='__'?'selected':''}>Sin proveedor asignado</option></select>
    <select id="sAlm" aria-label="Almacén"><option value="">Todos los almacenes</option>${alms.map(a=>`<option value="${a}" ${UI.stockAlm===String(a)?'selected':''}>Almacén ${a}</option>`).join('')}</select>
    <select id="sEst" aria-label="Estado"><option value="">Todos los estados</option><option value="activos" ${UI.stockEst==='activos'?'selected':''}>Con stock o movimiento</option><option value="alert" ${UI.stockEst==='alert'?'selected':''}>Con alerta (negativo, quiebre, cobertura)</option>${Object.entries(EST).map(([k,v])=>`<option value="${k}" ${UI.stockEst===k?'selected':''}>${v[0]}</option>`).join('')}</select>
  </div>
  ${table('stock',cols,rows,{sort:'a',dir:1,foot,click:o=>{UI.ficha=o.a;UI.tab='ficha';renderAll()}})}
  <p class="small muted" style="margin:0">Proveedor en <span class="inf">cursiva</span>: deducido por la marca de la descripción porque el artículo no tuvo remitos en el período. En pesables, “bultos” son piezas y el peso se muestra en kg.</p>`;
}
vStock.after=()=>{
  let tmr;$('#sQ').oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>{UI.stockQ=e.target.value;renderView();const i=$('#sQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
  $('#sProv').onchange=e=>{UI.stockProv=e.target.value;renderView()};$('#sAlm').onchange=e=>{UI.stockAlm=e.target.value;renderView()};$('#sEst').onchange=e=>{UI.stockEst=e.target.value;renderView()};
  $('#expStock').onclick=()=>exportXlsx('stock',`Stock_teorico_${CALC.D1}`);
};

/* ---- FICHA ---- */
function vFicha(){
  const L=CALC.list;if(!UI.ficha||!CALC.A[UI.ficha]){const top=L.filter(o=>o.venta>0).sort((a,b)=>b.venta-a.venta)[0];UI.ficha=top?top.a:L[0].a}
  const o=CALC.A[UI.ficha];
  const ms=CALC.movs.filter(m=>m.a===o.a&&m.d===1).sort((x,y)=>x.f<y.f?-1:x.f>y.f?1:TORD.indexOf(x.t)-TORD.indexOf(y.t)||x.n-y.n);
  let rb=o.ini,rk=o.iniK;const lines=[{f:CALC.D0,t:'',l:'Stock inicial',n:'',who:CALC.base.file,in:null,out:null,inK:null,outK:null,bal:rb,balK:rk,ini:1}];
  for(const m of ms){const s=sign(m.t);rb+=s*m.b;rk+=s*m.k;lines.push({f:m.f,t:m.t,l:TIPOS[m.t]?TIPOS[m.t].l:m.t,n:m.n,who:m.t==='REM'||m.t==='DEV'?m.pd:m.t==='ENS'?m.ddesc:m.tr,in:s>0?m.b:null,out:s<0?m.b:null,inK:s>0&&m.k?m.k:null,outK:s<0&&m.k?m.k:null,bal:rb,balK:rk,st:m.st})}
  const opts=L.map(x=>`<option value="${x.a}">${x.a} · ${esc(x.d)}</option>`).join('');
  const g=t=>o.b[t]||0;
  return`<div class="sec-h"><div><h2>${esc(o.d)}</h2><p>Artículo ${o.a} · ${provCell(o)} · Almacén ${o.alm??'–'} · ${chip(o.est)}</p></div>
    <div class="toolbar"><input class="inp" list="artList" id="fSel" placeholder="Buscar otro artículo" style="min-width:min(320px,100%)"><datalist id="artList">${opts}</datalist><button class="btn" id="expFicha">Exportar ficha</button></div></div>
  <div class="kpis">
    <div class="kpi"><span class="l">Inicial ${fDs(CALC.D0)}</span><span class="v">${fB(o.ini)}</span><span class="s">${o.pes?fK(o.iniK)+' kg':'bultos'}</span></div>
    <div class="kpi"><span class="l">Ingresos</span><span class="v">${fB(o.ingresos)}</span><span class="s">Compras ${fB(g('REM'))} · descargas ${fB(g('DES'))} · sobr. ${fB(g('SOB'))}</span></div>
    <div class="kpi"><span class="l">Egresos</span><span class="v">${fB(o.egresos)}</span><span class="s">Cargas ${fB(g('CAR'))} · dev. ${fB(g('DEV'))} · falt. ${fB(g('FAL'))} · venc. ${fB(g('ENS'))}</span></div>
    <div class="kpi hl"><span class="l">Final teórico ${fDs(CALC.D1)}</span><span class="v">${fB(o.fin)}</span><span class="s">${o.pes?fK(o.finK)+' kg · ':''}${o.valFin!=null?fM(o.valFin):'sin costo'}</span></div>
    <div class="kpi"><span class="l">Salida neta / cobertura</span><span class="v">${fB(o.venta)}</span><span class="s">${o.prom?NF1.format(o.prom)+' por día':'sin salidas'}${o.cob!=null?' · '+NF1.format(o.cob)+' días':''}</span></div>
    <div class="kpi"><span class="l">Costo de último remito</span><span class="v" style="font-size:20px">${o.cost?fM(o.cost.c)+(o.cost.base==='kg'?' /kg':''):'–'}</span><span class="s">${o.cost?`${fD(o.cost.f)} · ${esc(o.cost.p)}`:'No hubo remitos de este artículo'}</span></div>
  </div>
  <div class="card"><h3>Evolución del stock (bultos al cierre del día)</h3><div class="chart-box"><canvas id="chFicha"></canvas></div></div>
  <div class="card"><h3>Movimientos (kardex)</h3>
  ${table('ficha',[{k:'f',l:'Fecha',f:r=>fD(r.f),ns:1},{k:'t',l:'Tipo',cls:'code',ns:1},{k:'l',l:'Movimiento',ns:1},{k:'n',l:'N.º',n:1,ns:1},{k:'who',l:'Proveedor / chofer / destino',ns:1},{k:'in',l:'Entra',n:1,ns:1,f:r=>r.in==null?'':fB(r.in),cls:'pos'},{k:'out',l:'Sale',n:1,ns:1,f:r=>r.out==null?'':fB(r.out)},
    ...(o.pes?[{k:'inK',l:'Kg entra',n:1,ns:1,f:r=>r.inK==null?'':fK(r.inK)},{k:'outK',l:'Kg sale',n:1,ns:1,f:r=>r.outK==null?'':fK(r.outK)}]:[]),
    {k:'bal',l:'Saldo',n:1,ns:1,f:r=>`<b>${fB(r.bal)}</b>`,cls:r=>r.bal<0?'neg':''},...(o.pes?[{k:'balK',l:'Saldo kg',n:1,ns:1,f:r=>fK(r.balK),cls:r=>r.balK<-0.01?'neg':''}]:[])],lines,{})}</div>`;
}
vFicha.after=()=>{
  const o=CALC.A[UI.ficha];
  $('#fSel').onchange=e=>{const a=parseInt(e.target.value);if(CALC.A[a]){UI.ficha=a;renderView()}};
  $('#expFicha').onclick=()=>exportXlsx('ficha',`Ficha_${o.a}`);
  const byDay={};let r=o.ini;const ds=[CALC.D0,...CALC.days];
  const ms=CALC.movs.filter(m=>m.a===o.a&&m.d===1);
  const dm={};for(const m of ms)dm[m.f]=(dm[m.f]||0)+sign(m.t)*m.b;
  const vals=ds.map((d,i)=>{if(i)r+=dm[d]||0;return r});
  const navy=css('--navy'),org=css('--orange'),crit=css('--crit');
  chart('chFicha',{type:'line',data:{labels:ds.map(fDs),datasets:[{label:'Stock',data:vals,borderColor:navy,backgroundColor:navy+'22',fill:true,tension:0,borderWidth:2,pointRadius:vals.map((v,i)=>i===vals.length-1?5:0),pointBackgroundColor:vals.map(v=>v<0?crit:org)}]},
    options:{scales:{x:{grid:{display:false}},y:{ticks:{callback:v=>NF0.format(v)}}}},tip:{label:c=>`Stock: ${NF0.format(c.raw)} bultos`}});
};

/* ---- MOVIMIENTOS ---- */
function vMovs(){
  const docs={};
  for(const m of CALC.movs){
    if(UI.movTipo&&m.t!==UI.movTipo)continue;
    const k=`${m.d}|${m.t}|${m.s}|${m.n}`;const d=docs[k]||(docs[k]={k,dep:m.d,t:m.t,n:m.n,f:m.f,who:m.t==='REM'||m.t==='DEV'?m.pd:m.t==='ENS'?m.ddesc:m.tr,items:0,b:0,kg:0,v:0});
    d.items++;d.b+=m.b;d.kg+=m.k;const A=CALC.A[m.a];d.v+=(m.t==='REM'||m.t==='DEV')?m.st:(A&&A.cost?(A.cost.base==='kg'?m.k*A.cost.c:m.b*A.cost.c):0);
  }
  const rows=Object.values(docs);
  const sel=UI.movDoc&&docs[UI.movDoc];
  let detail='';
  if(sel){const ls=CALC.movs.filter(m=>`${m.d}|${m.t}|${m.s}|${m.n}`===sel.k).map(m=>({...m,desc:(DB.articles[m.a]||{}).d}));

/* ---- ROTACIÓN ---- */
function vRot(){
  const act=CALC.list.filter(o=>o.venta>0).sort((a,b)=>b.venta-a.venta);const tot=sum(act,o=>o.venta);let acc=0;
  for(const o of act){acc+=o.venta;const p=acc/tot;o.abc=p<=0.8||acc-o.venta===0?'A':p<=0.95?'B':'C';o.acc=p}
  const cls={A:[],B:[],C:[]};act.forEach(o=>cls[o.abc].push(o));
  const inm=CALC.list.filter(o=>o.est==='inmov');const qb=CALC.list.filter(o=>o.est==='quiebre'||o.est==='neg');const cob=CALC.list.filter(o=>o.est==='cob');
  const cc={A:'c-a',B:'c-warn',C:'c-mut'};
  return`<div class="sec-h"><div><h2>Rotación</h2><p>Clasificación ABC por salida neta en bultos: A concentra el 80 % del movimiento, B el 15 % siguiente y C el 5 % restante. Debajo, los artículos que necesitan atención.</p></div></div>
  <div class="kpis">${['A','B','C'].map(k=>`<div class="kpi"><span class="l">Clase ${k}</span><span class="v">${cls[k].length} <small>artículos</small></span><span class="s">${fB(sum(cls[k],o=>o.venta))} bultos · ${fP(sum(cls[k],o=>o.venta)/tot)} de la salida · stock ${fM(sum(cls[k],o=>o.valFin))}</span></div>`).join('')}
  <div class="kpi"><span class="l">Sin salidas en el período</span><span class="v">${inm.length} <small>artículos</small></span><span class="s">Con stock inmovilizado por ${fM(sum(inm,o=>o.valFin))}</span></div></div>
  <div class="card"><div class="sec-h" style="margin-bottom:10px"><h3 style="margin:0">Curva ABC</h3><button class="btn" id="expAbc">Exportar</button></div>
  ${table('abc',[{k:'abc',l:'Clase',f:o=>`<span class="chip ${cc[o.abc]}">${o.abc}</span>`},{k:'a',l:'Art.',cls:'code'},{k:'d',l:'Descripción',cls:'desc'},{k:'prov',l:'Proveedor',f:provCell},{k:'venta',l:'Salida neta',n:1,f:o=>fB(o.venta)},{k:'acc',l:'% acumulado',n:1,f:o=>fP(o.acc)},{k:'prom',l:'Prom./día',n:1,f:o=>NF1.format(o.prom)},{k:'fin',l:'Stock final',n:1,f:o=>fB(o.fin),cls:o=>o.fin<0?'neg':''},{k:'cob',l:'Cobertura',n:1,f:o=>o.cob==null?'–':NF1.format(o.cob)+' d'},{k:'est',l:'Estado',f:o=>chip(o.est)}],act,{sort:'venta',short:1,click:o=>{UI.ficha=o.a;UI.tab='ficha';renderAll()}})}</div>
  <div class="grid g2" style="align-items:start">
  <div class="card"><h3>Quiebres y stock negativo (${qb.length})</h3>${table('qb',[{k:'a',l:'Art.',cls:'code'},{k:'d',l:'Descripción',cls:'desc'},{k:'fin',l:'Final',n:1,f:o=>fB(o.fin),cls:o=>o.fin<0?'neg':''},{k:'venta',l:'Salida neta',n:1,f:o=>fB(o.venta)},{k:'lastOut',l:'Última carga',f:o=>fD(o.lastOut)},{k:'est',l:'Estado',f:o=>chip(o.est)}],qb,{sort:'venta',short:1,click:o=>{UI.ficha=o.a;UI.tab='ficha';renderAll()},empty:'Ningún artículo en quiebre.'})}</div>

/* ---- CONTROL VS STOCK ---- */
function vConc(){
  const b=baseSnap();const others=DB.snaps.filter(s=>s.date>b.date||(s.rec&&s.date>=b.date));
  if(!others.length)return`<div class="sec-h"><div><h2>Control contra un listado de stock posterior</h2><p>Compara el stock teórico que calcula la app con el stock que informa Chess (y con el recuento físico, si el listado lo trae) a una fecha posterior.</p></div></div>
    <div class="empty"><div><h2>Falta un listado de stock posterior al ${fD(b.date)}</h2><div class="ink2">Exportá desde Chess el listado de stock a una fecha dentro del período de movimientos (por ejemplo al ${fD(hasta())}) y cargalo. Si ese listado trae completas las columnas de <b>Recuento</b>, también se muestran las diferencias contra el conteo físico.</div></div><div class="drop" id="drop"><b>Soltá el listado de stock acá</b><span class="ink2">o hacé clic para elegirlo</span></div></div>`;
  const s=others.find(x=>x.date===UI.concSnap)||others[others.length-1];UI.concSnap=s.date;
  const C2=s.date>b.date?calc(s.date):CALC;const dateNote=s.date>movRange().mx?`<div class="note">Los movimientos cargados llegan al ${fD(movRange().mx)}; para esta fecha faltan movimientos y las diferencias van a estar infladas.</div>`:'';
  const codes=new Set([...Object.keys(s.rows),...Object.keys(C2.A)]);
  let rows=[];for(const a of codes){const o=C2.A[a];const r=s.rows[a]||[0,0,null,null];const th=o?o.fin:0,thK=o?o.finK:0;
    const row={a:+a,d:(DB.articles[a]||{}).d||'',th,thK,sys:r[0],sysK:r[1],dif:r[0]-th,difK:r[1]-thK,rec:r[2],recK:r[3],drec:r[2]==null?null:r[2]-r[0],drecK:r[3]==null?null:r[3]-r[1]};
    const c=DB.costs[a];row.difV=c?(c.base==='kg'?row.difK*c.c:row.dif*c.c):null;rows.push(row)}
  const all=rows.length,withDif=rows.filter(r=>Math.abs(r.dif)>0.001||Math.abs(r.difK)>0.01).length;
  if(UI.concOnly)rows=rows.filter(r=>Math.abs(r.dif)>0.001||Math.abs(r.difK)>0.01||(r.drec&&Math.abs(r.drec)>0.001));
  const hasRec=!!s.rec;
  return`<div class="sec-h"><div><h2>Control contra el stock de Chess al ${fD(s.date)}</h2><p>Diferencia = stock informado por Chess − stock teórico calculado (stock base + movimientos). Una diferencia indica movimientos faltantes en la planilla o ajustes hechos fuera de los comprobantes.</p></div>
    <div class="toolbar"><select id="cSnap" aria-label="Listado de stock">${others.map(x=>`<option value="${x.date}" ${x.date===s.date?'selected':''}>${fD(x.date)} · ${esc(x.file)}</option>`).join('')}</select>
    <label class="small"><input type="checkbox" id="cOnly" ${UI.concOnly?'checked':''}> Sólo con diferencia</label><button class="btn" id="expConc">Exportar</button></div></div>
  ${dateNote}
  <div class="kpis"><div class="kpi"><span class="l">Artículos comparados</span><span class="v">${all}</span></div><div class="kpi hl"><span class="l">Con diferencia</span><span class="v">${withDif}</span><span class="s">${fP(withDif/all)} del total</span></div><div class="kpi"><span class="l">Diferencia valorizada</span><span class="v">${fM(sum(rows,r=>r.difV))}</span></div>${hasRec?`<div class="kpi"><span class="l">Recuento físico</span><span class="v">${s.rec} <small>artículos</small></span><span class="s">Diferencia recuento − sistema: ${fB(sum(rows,r=>r.drec||0))} bultos</span></div>`:''}</div>
  ${table('conc',[{k:'a',l:'Art.',cls:'code'},{k:'d',l:'Descripción',cls:'desc'},{k:'th',l:'Teórico',n:1,f:r=>fB(r.th)},{k:'sys',l:'Chess',n:1,f:r=>fB(r.sys)},{k:'dif',l:'Diferencia',n:1,f:r=>fB(r.dif),cls:r=>r.dif<0?'neg':r.dif>0?'pos':''},{k:'thK',l:'Kg teórico',n:1,f:r=>fK(r.thK)},{k:'sysK',l:'Kg Chess',n:1,f:r=>fK(r.sysK)},{k:'difK',l:'Dif. kg',n:1,f:r=>fK(r.difK),cls:r=>r.difK<-0.01?'neg':r.difK>0.01?'pos':''},{k:'difV',l:'Dif. $',n:1,f:r=>r.difV==null?'s/costo':fM(r.difV)},
    ...(hasRec?[{k:'rec',l:'Recuento',n:1,f:r=>r.rec==null?'–':fB(r.rec)},{k:'drec',l:'Rec. − Chess',n:1,f:r=>r.drec==null?'–':fB(r.drec),cls:r=>r.drec<0?'neg':r.drec>0?'pos':''}]:[])],rows,{sort:'difV',dir:1,click:o=>{UI.ficha=o.a;UI.tab='ficha';renderAll()},empty:'Sin diferencias: el stock teórico coincide con Chess.'})}`;
}
vConc.after=()=>{bindDrop();const s=$('#cSnap');if(!s)return;s.onchange=e=>{UI.concSnap=e.target.value;renderView()};$('#cOnly').onchange=e=>{UI.concOnly=e.target.checked;renderView()};$('#expConc').onclick=()=>exportXlsx('conc','Control_stock')};

/* ---- DATOS ---- */
function vDatos(){
  const b=baseSnap();const r=movRange();
  const byType={};for(const m of DB.movs)byType[m.t]=(byType[m.t]||0)+1;
  const ncost=Object.keys(DB.costs).length;
  return`<div class="sec-h"><div><h2>Datos y configuración</h2><p>Los datos se guardan en este navegador. Volver a cargar un archivo de movimientos reemplaza los comprobantes repetidos, así que se pueden cargar meses que se superponen.</p></div></div>
  <div class="drop" id="drop"><b>Importar planillas de Chess</b><span class="ink2">Soltá acá listados de stock y de movimientos (.xlsx) o hacé clic para elegirlos</span></div>
  ${UI.lastLog?`<div class="card"><h3>Resultado de la última importación</h3><pre class="log">${esc(UI.lastLog)}</pre></div>`:''}
  <div class="grid g2" style="align-items:start">
  <div class="card"><h3>Listados de stock</h3>
    ${DB.snaps.length?`<div class="tbl-wrap short"><table><thead><tr><th class="ns">Fecha</th><th class="ns">Archivo</th><th class="ns n">Artículos</th><th class="ns">Uso</th><th class="ns"></th></tr></thead><tbody>${DB.snaps.map((s,i)=>`<tr><td><input type="date" class="inp" data-sd="${i}" value="${s.date}"></td><td>${esc(s.file)}</td><td class="n">${Object.keys(s.rows).length}</td><td>${s===b?'<span class="chip c-a">Stock base</span>':`<button class="btn" data-sb="${i}">Usar como base</button>`}${s.rec?' <span class="chip c-ok">Con recuento</span>':''}</td><td><button class="btn dng" data-sx="${i}">Quitar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Todavía no hay listados de stock.</p>'}
  </div>
  <div class="card"><h3>Movimientos cargados</h3>
    ${DB.movs.length?`<p style="margin:0 0 8px">${NF0.format(DB.movs.length)} líneas · fecha de stock del ${fD(DB.movs[0].f)} al ${fD(DB.movs[DB.movs.length-1].f)}${b?` · en el período del stock base: ${fD(r.mn)} a ${fD(r.mx)}`:''}</p>
    <div class="small ink2">${Object.entries(byType).sort().map(([t,n])=>`${t}${TIPOS[t]?'':' (no reconocido)'}: ${NF0.format(n)}`).join(' · ')}</div>
    <p class="small ink2">${ncost} artículos con costo de último remito.</p>
    <div class="small muted">Archivos: ${DB.files.filter(f=>f.kind==='mov').map(f=>`${esc(f.name)} (${fD(f.from)}–${fD(f.to)})`).join(', ')}</div>
    <div style="margin-top:10px"><button class="btn dng" id="clrMov">Borrar todos los movimientos</button></div>`:'<p class="muted">Todavía no hay movimientos.</p>'}
  </div></div>
  <div class="grid g3" style="align-items:start">
  <div class="card"><h3>Parámetros</h3><label class="small" for="cfgCob">Alerta de cobertura baja (días)</label><div class="toolbar" style="margin-top:6px"><input class="inp" type="number" id="cfgCob" min="1" max="90" value="${CFG.cob}" style="width:90px"><button class="btn" id="saveCob">Guardar</button></div></div>
  <div class="card"><h3>Contraseña</h3><div class="toolbar"><input class="inp" type="password" id="newPw" placeholder="Nueva contraseña" autocomplete="new-password"><button class="btn" id="savePw">Cambiar</button></div></div>
  <div class="card"><h3>Copia de seguridad</h3><div class="toolbar"><button class="btn" id="bkOut">Descargar respaldo</button><button class="btn" id="bkInB">Restaurar respaldo</button><button class="btn dng" id="clrAll">Borrar todo</button></div></div>
  </div>
  <div class="card"><h3>Cómo se interpretan los movimientos</h3>
  ${table('tdoc',[{k:'t',l:'Código',cls:'code',ns:1},{k:'l',l:'Movimiento',ns:1},{k:'e',l:'Efecto en el Depósito Casa Central',ns:1}],TORD.map(t=>({t,l:TIPOS[t].l,e:t==='RCS'?'Ingreso al depósito de vencidos/roturas (no afecta Casa Central)':TIPOS[t].s>0?'Suma al stock':'Resta del stock'})),{short:1})}
  <p class="small muted" style="margin:8px 0 0">Se usa la <b>Fecha Stock</b> de cada comprobante: los movimientos con fecha de stock igual o anterior a la del stock base ya están incluidos en él. Las celdas que Chess exporta con decimales mal interpretados por Excel (ej. 1711402 en lugar de 1.711,402) se corrigen automáticamente.</p></div>`;
}
vDatos.after=()=>{
  bindDrop();
  document.querySelectorAll('[data-sd]').forEach(i=>i.onchange=e=>{const s=DB.snaps[+i.dataset.sd];const old=s.date;s.date=e.target.value;if(CFG.baseDate===old)CFG.baseDate=s.date;DB.snaps.sort((x,y)=>x.date<y.date?-1:1);save();renderAll()});
  document.querySelectorAll('[data-sb]').forEach(bt=>bt.onclick=()=>{CFG.baseDate=DB.snaps[+bt.dataset.sb].date;CFG.hasta=null;save();renderAll()});
  document.querySelectorAll('[data-sx]').forEach(bt=>bt.onclick=()=>{const s=DB.snaps[+bt.dataset.sx];confirmBox(`¿Quitar el listado de stock del ${fD(s.date)}?`,()=>{DB.snaps.splice(+bt.dataset.sx,1);save();renderAll()})});
  const cm=$('#clrMov');if(cm)cm.onclick=()=>confirmBox('¿Borrar todos los movimientos cargados? El stock y la configuración se mantienen.',()=>{DB.movs=[];DB.costs={};DB.files=DB.files.filter(f=>f.kind!=='mov');inferProviders();save();renderAll()});
  $('#saveCob').onclick=()=>{const v=parseInt($('#cfgCob').value);if(v>0){CFG.cob=v;save();renderAll();toast('Parámetro guardado.')}};
  $('#savePw').onclick=()=>{const v=$('#newPw').value.trim();if(v.length<4){toast('La contraseña debe tener al menos 4 caracteres.');return}CFG.pw=v;save();$('#newPw').value='';toast('Contraseña actualizada.')};
  $('#bkOut').onclick=()=>{try{const blob=new Blob([JSON.stringify({DB,CFG})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`respaldo_stock_DL_${new Date().toISOString().slice(0,10)}.json`;a.click()}catch(e){toast('La descarga no está disponible en esta vista.')}};
  $('#bkInB').onclick=()=>$('#bkIn').click();
  $('#clrAll').onclick=()=>confirmBox('¿Borrar todos los datos (stock, movimientos y costos)? Esta acción no se puede deshacer.',()=>{DB={articles:{},snaps:[],movs:[],files:[],costs:{}};CFG.baseDate=null;CFG.hasta=null;save();renderAll()});
};

/* ============ ARRANQUE ============ */
$('#fileIn').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)importFiles(f)};
$('#bkIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(!o.DB||!o.DB.snaps)throw new Error();DB=o.DB;CFG=Object.assign(CFG,o.CFG||{});save();renderAll();toast('Respaldo restaurado.')}catch(err){toast('El archivo no es un respaldo válido de esta app.')}};
function unlock(){$('#login').hidden=true;try{sessionStorage.setItem('dl_stock_ok','1')}catch(e){}renderAll()}
$('#loginForm').onsubmit=e=>{e.preventDefault();if($('#pw').value===CFG.pw)unlock();else{$('#pwErr').textContent='Contraseña incorrecta.';$('#pw').select()}};

// ── Recibir sesión desde el tablero padre ──────────────────────────
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'DL_SESSION') return;
  // Autenticar automáticamente cuando el tablero envía la sesión
  unlock();
});

let ok=false;try{ok=sessionStorage.getItem('dl_stock_ok')==='1'}catch(e){}
if(ok){unlock();}else{
  renderAll();
  setTimeout(()=>{
    // Pedir token al padre si estamos en iframe
    if(window.parent && window.parent !== window){
      window.parent.postMessage({ type: 'DL_REQUEST_TOKEN' }, '*');
    } else {
      $('#pw').focus();
    }
  }, 50);
}
window.addEventListener('resize',()=>{});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>renderView());
</script>

</body></html>
